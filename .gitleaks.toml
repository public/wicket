# gitleaks' default rules, minus third-party code vendored as is (its tests carry public keys).
[extend]
useDefault = true

[[allowlists]]
description = "third-party code vendored as is"
paths = ['''^experiments/[^/]+/vendor/''', '''^third_party/''']

[[allowlists]]
description = "RFC 8410 §10.3's published example Ed25519 key, a test vector (crates/wicket-identity/src/node.rs), in two commits before its PEM armour was built at runtime"
commits = ["dc0e969a96370e9ebb81ec46a33d69d589b46725", "67f2eebfe8e8df23c46b5a0013adfe145d8c4a19"]

[[allowlists]]
# The fuzz seed corpora (#323) hold feed messages the tests sign with throwaway keys (feed "n1",
# run_a, api.example.com, a fixed test clock). They're JWS-shaped by design. Only the jwt rule, only there.
description = "fuzz seed corpora: synthetic feed JWS"
targetRules = ["jwt"]
paths = ['''^fuzz/corpus/feed/''']

[[allowlists]]
description = "RFC 6455 §1.3's published sample Sec-WebSocket-Key ('the sample nonce'), a test vector, in two commits before the conformance tests (#361) used a zero key"
commits = ["410127960e104b3caa475fb1d8654d56d86ee590", "65679d4b0bbe0cb67d96dd25ad0956dcfe792c56"]
