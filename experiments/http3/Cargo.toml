[package]
name = "http3-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "Experiment #92: HTTP/3 egress for boxes: UDP on lo in gVisor, wicket DNS, QUIC termination with quinn + h3."

# Standalone: not a member of the repo workspace.
[workspace]

[dependencies]
wicket-core = { path = "../../crates/wicket-core" }
anyhow = "1"
bytes = "1"
http = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
# ring everywhere (as wicket-proxy): quinn's default provider is aws-lc-rs.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.13"
time = "0.3"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hyper = { version = "1", features = ["http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[profile.release]
debug = 1
