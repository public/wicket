[package]
name = "bundle-formats"
version = "0.0.0"
edition = "2021"
publish = false
description = "Experiment E5 (#195): hibernation bundles, wicket's tar+zstd+sealing vs the restic format (rustic_core) vs tar+zstd+age."

# Standalone: not a member of the repo workspace.
[workspace]

[dependencies]
wicket-store = { path = "../../crates/wicket-store" }
rustic_core = "0.13"
rustic_backend = { version = "0.7", features = ["opendal"] }
age = "0.11"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
rand_chacha = "0.3"
libc = "0.2"
serde_yaml = "0.9"
# wicket's own S3 client (crates/wicket-cli/src/s3.rs, included by path) needs these.
wicket-agent = { path = "../../crates/wicket-agent" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio = { version = "1", features = ["full"] }
url = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
ulid = "1"
futures-util = "0.3"

[profile.release]
debug = 1
