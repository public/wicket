[package]
name = "biscuit-datablocks"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: not a member of the main wicket workspace.
[workspace]

[dependencies]
# Stock release: mints the tokens, as in biscuit-depth and biscuit-fast.
biscuit-auth = "=6.0.0"
# biscuit-fast's fork (upstream main aa5a672 plus its patches), copied unchanged into vendor/.
fork = { package = "biscuit-auth", path = "../biscuit-fast/vendor/biscuit-auth" }
wicket-core = { path = "../../crates/wicket-core" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
regex = "1"
# Same version biscuit-auth 6.0.0 uses, only to edit tokens at the protobuf level in the tampering tests.
prost = "=0.10.4"

[profile.release]
debug = false
codegen-units = 16
