name: CI

on:
  pull_request:
    # `labeled`: adding the full-ci label runs everything (#218).
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  # GitHub's merge queue (#220): each queued PR is tested on top of the latest main, and of the PRs
  # ahead of it, before it lands. The queue itself is a repository setting the owner turns on; its
  # required checks must run on this event, which these jobs do as they are.
  merge_group:
  # The full set, nightly (a PR runs what its change can affect).
  schedule:
    - cron: "41 2 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # #218: what a pull request can affect (ci/determinator: guppy's determinator with its rules.toml,
  # and suites.toml): its crates and their reverse dependencies, and the end-to-end suites. Pushes to
  # main, the merge queue, the nightly run and a PR labelled full-ci select everything. Every job
  # below runs in full when this job fails or says nothing: an empty output means run.
  select:
    name: What this change can affect
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Reading the pull request's labels (#246).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      crates: ${{ steps.select.outputs.crates }}
      all_crates: ${{ steps.select.outputs.all_crates }}
      args: ${{ steps.select.outputs.args }}
      filter: ${{ steps.select.outputs.filter }}
      doc_args: ${{ steps.select.outputs.doc_args }}
      rust: ${{ steps.select.outputs.rust }}
      suites: ${{ steps.select.outputs.suites }}
      fuzz: ${{ steps.select.outputs.fuzz }}
      fuzz_matrix: ${{ steps.select.outputs.fuzz_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ci/determinator -> target
          # select-tests saves this cache (its build has what `cargo run` needs).
          shared-key: select
          save-if: false
      - id: select
        name: Select
        # The full-ci label as the pull request has it now, from the API (#246), not as this event's
        # payload had it: a label added just after a push is in neither the push's payload nor, once
        # the push's run has cancelled it, a run of its own. Unreadable labels select the full set.
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          PR: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          affected() { cargo run -q --locked --manifest-path ci/determinator/Cargo.toml -- "$@"; }
          FULL=
          if [ "$EVENT" = pull_request ]; then
            FULL=$(ci/pr-has-label.sh full-ci) || FULL="unknown (the labels couldn't be read)"
          fi
          if [ "$EVENT" = pull_request ] && [ "$FULL" = false ]; then
            affected --base "origin/$BASE" --github-output "$GITHUB_OUTPUT"
          else
            echo "the full set ($EVENT; full-ci label: ${FULL:-n/a})"
            affected --files /dev/null --github-output "$GITHUB_OUTPUT"
          fi
          # The fuzz targets in groups of at most three, dealt out in turn, as a JSON list of
          # space-separated names: the fuzz job's matrix, one job per group (#462: a full run's jobs
          # then fit the 15 runners it gets at once). Nothing selected (`none`) is an empty list, no
          # selection (an empty `fuzz=`) every target.
          fuzz=$(sed -n 's/^fuzz=//p' "$GITHUB_OUTPUT" | tail -1)
          case "$fuzz" in
            none) list=() ;;
            "") mapfile -t list < <(ci/fuzz.sh --list) ;;
            *) read -r -a list <<<"$fuzz" ;;
          esac
          echo "fuzz_matrix=$(python3 -c '
          import json, sys
          t = sys.argv[1:]
          k = -(-len(t) // 3)
          print(json.dumps([" ".join(t[i::k]) for i in range(k)]))' "${list[@]}")" >>"$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT" >>"$GITHUB_STEP_SUMMARY"

  # The selection's own tests (#218), beside it rather than before it (#460): every job waits on the
  # selection, and nothing on these. A broken rule fails this job, and so the change.
  select-tests:
    name: The selection's own tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ci/determinator -> target
          # The same cache as the selection's.
          shared-key: select
      - name: The rules' own tests (synthetic changes, every file claimed, every out-of-crate input mapped)
        run: cargo test --locked --manifest-path ci/determinator/Cargo.toml
      - name: The label check's own test
        run: ci/pr-has-label_test.sh

  # The repository is public: no secrets or details of real machines, in any commit.
  public:
    name: No secrets or machine details
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: wicket's own checks (tokens, home paths, public IPs)
        run: ci/check-public.py
      - name: relative links in Markdown files
        run: ci/check-doc-links.sh
      - name: one word per thing in the docs and the CLI's help (#332)
        run: ci/check-terms.sh
      - name: the Claude Code plugin, its skills and their links
        run: ci/check-plugin.py
      - name: gitleaks, every commit
        run: |
          f=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar xzf "$f" gitleaks
          # Every commit reachable from the one under test (not other branches, which have their own runs).
          ./gitleaks git --redact --no-banner --log-opts="HEAD" --config .gitleaks.toml .

  # Supply chain (#326): cargo deny (deny.toml) on every pull request, push and nightly run:
  # RustSec advisories (vulnerable, unsound or yanked crates), licences, banned crates and sources.
  # Nightly too, so an advisory published against an unchanged lockfile is seen. Duplicate
  # versions are reported, not failed (#219).
  deny:
    name: Supply chain (cargo deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_DENY_VERSION: 0.20.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Caches ~/.cargo/bin, so cargo-deny is built once per version.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: cargo-deny
          cache-targets: false
      - name: cargo-deny (from crates.io, its locked dependencies checksum-verified)
        run: cargo deny --version 2>/dev/null | grep -q " $CARGO_DENY_VERSION" || cargo install --locked "cargo-deny@$CARGO_DENY_VERSION"
      - name: cargo deny check
        run: cargo deny --locked check

  rust:
    name: Format, clippy and tests
    needs: select
    if: ${{ !cancelled() && needs.select.outputs.rust != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXTEST_VERSION: 0.9.151
      NEXTEST_SHA256: 1d4ce302b820c41f4b89c5fb9bce45f0f0c94882c1cf08fc360caf08be6e7df4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      # Keyed on Cargo.toml too: rust-cache's own key stayed the same through #524's [profile] change,
      # so every run restored the old build, rebuilt all of it, and never saved (an exact hit).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      - name: Selected crates
        id: pkgs
        env:
          ARGS: ${{ needs.select.outputs.args }}
          FILTER: ${{ needs.select.outputs.filter }}
          DOC_ARGS: ${{ needs.select.outputs.doc_args }}
          ALL: ${{ needs.select.outputs.all_crates }}
        # ci/determinator builds the package arguments and nextest's filterset (its tests cover
        # them): `-p` per affected crate and rdeps() of each changed one, empty when none (a doctest
        # step then skips). No selection (its job failed): everything.
        run: |
          if [ "$ALL" = false ]; then
            echo "args=$ARGS" >>"$GITHUB_OUTPUT"
            echo "filter=$FILTER" >>"$GITHUB_OUTPUT"
            echo "doc_args=$DOC_ARGS" >>"$GITHUB_OUTPUT"
          else
            echo "args=--workspace" >>"$GITHUB_OUTPUT"
            echo "filter=all()" >>"$GITHUB_OUTPUT"
            echo "doc_args=--workspace" >>"$GITHUB_OUTPUT"
          fi
      - name: cargo-nextest (a CI tool, checksum-verified)
        if: ${{ steps.pkgs.outputs.args != '' }}
        run: |
          f=cargo-nextest-${NEXTEST_VERSION}-x86_64-unknown-linux-gnu.tar.gz
          curl -sSfLO "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/$f"
          echo "${NEXTEST_SHA256}  $f" | sha256sum -c -
          tar xzf "$f" -C ~/.cargo/bin cargo-nextest
      - run: cargo fmt --all -- --check
      - if: ${{ steps.pkgs.outputs.args != '' }}
        run: cargo clippy ${{ steps.pkgs.outputs.args }} --all-targets --locked -- -D warnings
      - name: Tests (nextest; a test that passed only on a retry is reported as flaky)
        if: ${{ steps.pkgs.outputs.args != '' }}
        env:
          FILTER: ${{ steps.pkgs.outputs.filter }}
        run: |
          set -o pipefail
          cargo nextest run ${{ steps.pkgs.outputs.args }} -E "$FILTER" --locked --profile ci 2>&1 | tee nextest.log
          if grep -q FLAKY nextest.log; then
            { echo "### Flaky tests (passed on a retry)"; grep FLAKY nextest.log | sed 's/^/    /'; } >>"$GITHUB_STEP_SUMMARY"
          fi
      - name: Doctests (nextest doesn't run them)
        if: ${{ steps.pkgs.outputs.doc_args != '' }}
        run: cargo test ${{ steps.pkgs.outputs.doc_args }} --locked --doc

  # #323: the fuzz targets a change selects (ci/determinator/suites.toml's fuzz targets; none selected
  # says `none`, no selection says nothing: every target), 60 s each. In groups of up to three, one
  # job each (#462): a group's targets share its build, and a full run's jobs fit the runners it
  # gets at once; the corpora are replayed once, in a job of their own. Coverage only (no ASan): the optimized build that also
  # fits a 4 GiB box. The jobs share the nightly run's build cache (fuzz.yml, the same job id and
  # key): one build serves every target. Findings are minimized and uploaded; the nightly run runs
  # every target for longer. `Fuzz (short)` passes when the replay and every target did.
  fuzz-replay:
    name: Fuzz corpora and past findings (stable)
    needs: select
    if: ${{ !cancelled() && needs.select.outputs.fuzz != 'none' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz -> target
          key: replay
      - run: cd fuzz && cargo test --locked

  fuzz-target:
    # No matrix expression in the name: GitHub adds the group's targets, and a run cancelled before
    # the matrix exists leaves no check named after an unexpanded expression.
    name: Fuzz targets
    needs: select
    if: ${{ !cancelled() && needs.select.outputs.fuzz != 'none' && needs.select.outputs.fuzz_matrix != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        targets: ${{ fromJSON(needs.select.outputs.fuzz_matrix || '[]') }}
    env:
      FUZZ_WORK: ${{ github.workspace }}/fuzz-work
      TARGETS: ${{ matrix.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz -> target
          # One build serves every target (the harnesses are one library), as in fuzz.yml.
          key: fuzz-none
          save-if: ${{ contains(matrix.targets, 'egress') }}
      - name: Fuzz ${{ matrix.targets }}
        # Word-split on purpose: the group's targets, fuzzed at once (one core each; a runner has
        # four), each for its full 60 s: the group takes one target's time, not three.
        run: ci/fuzz.sh --no-replay --secs 60 --jobs 3 $TARGETS
      - name: Findings (minimized) and logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-${{ strategy.job-index }}
          path: |
            fuzz-work/artifacts
            fuzz-work/*.log
          if-no-files-found: ignore

  fuzz:
    name: Fuzz (short)
    needs: [select, fuzz-replay, fuzz-target]
    if: ${{ !cancelled() && needs.select.outputs.fuzz != 'none' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The replay and every selected target passed
        env:
          REPLAY: ${{ needs.fuzz-replay.result }}
          TARGETS: ${{ needs.fuzz-target.result }}
        run: |
          echo "replay: $REPLAY; targets: $TARGETS"
          [ "$REPLAY" = success ] && { [ "$TARGETS" = success ] || [ "$TARGETS" = skipped ]; }

  # #327: the console's session view (web/session): its bundle built from the committed lockfile,
  # licence-checked and reproduced byte for byte (ci/session-view.sh), then embedded in the binary
  # for the serve tests and the view's own client driven against the real endpoint under node.
  session-view:
    name: Session view bundle
    needs: select
    if: ${{ !cancelled() && needs.select.outputs.rust != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # A pinned Node, checksum-verified (ci/install-node.sh); the same in build.yml and release.yml.
      NODE_VERSION: 22.23.5
      NODE_SHA256: "cdeb8670a0c81f51b4dc4ac61919f9b1ad917b304bf8221eb939570663d240f8" # node-v22.23.5-linux-x64.tar.xz, from nodejs.org/dist/v22.23.5/SHASUMS256.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      - name: Node (pinned)
        run: ci/install-node.sh
      - name: Build, reproduce, embed and test
        run: ci/session-view.sh --test

  # #51: SymCC (with cvc5, checksum-verified) on its fixtures, and on the example org policies a
  # change touches: narrows or widens. A solver timeout or `unknown` fails.
  policy:
    name: SymCC policy diffs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      - run: ci/policy-diff.sh "origin/$BASE"
        env:
          BASE: ${{ github.base_ref || 'main' }}

  # #322: the Lean spec of authority and matching (verification/lean): its proofs, with no `sorry`,
  # and wicket-core checked against it as an oracle on fixtures and generated cases. Lean is pinned
  # and checksum-verified (ci/lean.sh); no Mathlib.
  lean:
    name: Lean spec and oracle
    needs: select
    if: ${{ !cancelled() && (needs.select.outputs.suites == '' || contains(needs.select.outputs.suites, ' lean ')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      - run: ci/lean.sh

  # #321: TLC on the TLA+ models under verification/tla/, at the bounds their .cfg files state
  # (a few minutes), when they or the code they model change. A pinned, checksum-verified JRE.
  # In two parts at once (#460; ci/tla.sh --shard splits the models by their CI times, longest
  # first): GrantsOnNodes's three pass_grants_* models are 273 s of 327 s, so two parts are 164 and
  # 163 s by `ci/tla.sh --plan 2` and end well before the gVisor jobs. Three parts only gave Kani's
  # fourth a runner to wait for. One job says all passed.
  tla-shard:
    name: TLA+ models (TLC) ${{ matrix.shard }}/2
    needs: select
    if: ${{ !cancelled() && (needs.select.outputs.suites == '' || contains(needs.select.outputs.suites, ' tla ')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ci/tla.sh --shard "${{ matrix.shard }}/2"

  tla:
    name: TLA+ models (TLC)
    needs: [select, tla-shard]
    if: ${{ !cancelled() && (needs.select.outputs.suites == '' || contains(needs.select.outputs.suites, ' tla ')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          SHARDS: ${{ needs.tla-shard.result }}
        run: |
          echo "parts: $SHARDS"
          [ "$SHARDS" = success ]

  # #325: Kani proof harnesses (bounded model checking of wicket-core's decision functions, each
  # naming the Lean theorem of #322 it restates) and the budget counter's loom test, one harness at
  # a time (ci/kani.sh). Selected by ci/determinator/suites.toml's kani suite: the harnessed crate
  # (its code, its harnesses), the script.
  # In four parts at once (#460; ci/kani.sh --shard splits the harnesses and loom by their CI
  # times, longest first: 264, 263, 264 and 264 s of 1055 s by `ci/kani.sh --plan 4`; in three
  # they were 353 s each), and one job that says they all passed.
  kani-shard:
    name: Kani proofs and loom ${{ matrix.shard }}/4
    needs: select
    if: ${{ !cancelled() && (needs.select.outputs.suites == '' || contains(needs.select.outputs.suites, ' kani ')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      KANI_VERSION: 0.68.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # One cache for the parts (Kani itself, and wicket-core built for it); the first saves it.
          shared-key: kani-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ matrix.shard == 1 }}
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier --version "$KANI_VERSION"
          cargo kani setup
      - run: ci/kani.sh --shard "${{ matrix.shard }}/4"

  kani:
    name: Kani proofs and loom
    needs: [select, kani-shard]
    if: ${{ !cancelled() && (needs.select.outputs.suites == '' || contains(needs.select.outputs.suites, ' kani ')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          SHARDS: ${{ needs.kani-shard.result }}
        run: |
          echo "parts: $SHARDS"
          [ "$SHARDS" = success ]

  # #324: the deterministic simulation (crates/wicket-sim). A pull request runs its fixed seeds with
  # the crate's tests, whenever ci/determinator selects it. This runs 1000 more of each scenario
  # (and 100000 of `update`, which costs next to nothing), a different block each night, four at once
  # (ci/sim.sh), and files an issue for each failing seed with its replay command. A bug in about
  # 0.4% of seeds, as #494 was, is found on 98% of nights (on 70% with 300).
  simulation:
    name: Simulation seeds (nightly)
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      - run: ci/sim.sh --seeds 1000 --file-issues
        env:
          GH_TOKEN: ${{ github.token }}

  # One Claude Code agent in a gVisor box, end to end, driven by the scripted mock model: no model
  # credential is used. Then hibernation, restore and the install path. Acceptance, the longest
  # suite, runs beside it in a job of its own (#460), each after the same setup
  # (.github/actions/gvisor-setup).
  smoke:
    name: gVisor smoke test
    needs: select
    # Any of its suites selected (or no selection: everything).
    if: ${{ !cancelled() && (needs.select.outputs.suites == '' || contains(needs.select.outputs.suites, ' smoke ') || contains(needs.select.outputs.suites, ' hibernate ') || contains(needs.select.outputs.suites, ' restore ') || contains(needs.select.outputs.suites, ' services ') || contains(needs.select.outputs.suites, ' daemon-uids ') || contains(needs.select.outputs.suites, ' install-test ')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gvisor-setup
        with:
          save-cache: "true"
      - name: Build the agent image
        run: target/debug/wicket image
      - name: Smoke test
        if: ${{ needs.select.outputs.suites == '' || contains(needs.select.outputs.suites, ' smoke ') }}
        run: WICKET=target/debug/wicket H3GET=ci/h3get/target/x86_64-unknown-linux-musl/release/h3get ci/smoke.sh
      - name: Hibernate and wake
        if: ${{ needs.select.outputs.suites == '' || contains(needs.select.outputs.suites, ' hibernate ') }}
        run: WICKET=target/debug/wicket ci/hibernate.sh
      # #154: the ledger streamed to an S3-compatible store, the host lost, a standby restored.
      - name: Restore onto a standby
        if: ${{ needs.select.outputs.suites == '' || contains(needs.select.outputs.suites, ' restore ') }}
        run: WICKET=target/debug/wicket ci/restore.sh
      # #579 step 3: the npm cache installed as a per-node service, and boxes using it.
      - name: Per-node services
        if: ${{ needs.select.outputs.suites == '' || contains(needs.select.outputs.suites, ' services ') }}
        run: WICKET=target/debug/wicket ci/service-e2e.sh
      # #12: the daemon with real, different uids (nobody as an operator, root as the break-glass).
      - name: wicketd with second uids
        if: ${{ needs.select.outputs.suites == '' || contains(needs.select.outputs.suites, ' daemon-uids ') }}
        run: ci/daemon-uids.sh target/debug/wicket
      # #40: the host install script, twice, in a fresh container, then #12's checks with real users.
      - name: Install script in a fresh container
        if: ${{ needs.select.outputs.suites == '' || contains(needs.select.outputs.suites, ' install-test ') }}
        run: ci/install-test.sh target/debug/wicket ubuntu:24.04

  # #41: the release acceptance test's local flows (a few minutes; the multi-host and installed
  # variants run nightly, .github/workflows/acceptance.yml).
  acceptance:
    name: gVisor acceptance
    needs: select
    if: ${{ !cancelled() && (needs.select.outputs.suites == '' || contains(needs.select.outputs.suites, ' acceptance ')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gvisor-setup
      - name: Build the agent image
        run: target/debug/wicket image
      - name: Acceptance
        run: WICKET=target/debug/wicket IMAGE=wicket/claude-code:poc H3GET=ci/h3get/target/x86_64-unknown-linux-musl/release/h3get ci/acceptance.sh
