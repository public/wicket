name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # The repository is public: no secrets or details of real machines, in any commit.
  public:
    name: No secrets or machine details
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: wicket's own checks (tokens, home paths, public IPs)
        run: ci/check-public.py
      - name: gitleaks, every commit
        run: |
          f=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar xzf "$f" gitleaks
          # Every commit reachable from the one under test (not other branches, which have their own runs).
          ./gitleaks git --redact --no-banner --log-opts="HEAD" --config .gitleaks.toml .

  rust:
    name: Format, clippy and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # One Claude Code agent in a gVisor box, end to end, driven by the scripted mock model: no model
  # credential is used.
  smoke:
    name: gVisor smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install gVisor as a Docker runtime
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor --yes -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          # gVisor's apt repository is sometimes caught mid-sync ("File has unexpected size"): retry.
          for i in 1 2 3 4; do
            if sudo apt-get update -q && sudo apt-get install -y -q runsc; then break; fi
            [ "$i" = 4 ] && exit 1
            echo "gVisor apt install failed (attempt $i), retrying in $((i * 20)) s"; sleep $((i * 20))
          done
          # Keep the runner's own Docker settings; add runsc with host unix sockets (wicket's proxies).
          cfg=/etc/docker/daemon.json
          [ -f "$cfg" ] || echo '{}' | sudo tee "$cfg" >/dev/null
          jq '.runtimes.runsc = {path: "/usr/bin/runsc", runtimeArgs: ["--host-uds=open"]}' "$cfg" | sudo tee "$cfg.new" >/dev/null
          sudo mv "$cfg.new" "$cfg"
          sudo systemctl restart docker
          runsc --version | head -1
          docker info --format 'runtimes: {{range $k, $v := .Runtimes}}{{$k}} {{end}}'
      - run: cargo build -p wicket-cli --locked
      - name: Build the agent image
        run: target/debug/wicket image
      - name: Smoke test
        run: WICKET=target/debug/wicket ci/smoke.sh
      - name: Hibernate and wake
        run: WICKET=target/debug/wicket ci/hibernate.sh
