name: Release

# On a version tag (v0.0.1, ...): build the release binary, package it with what deploy/install.sh
# needs, and attach the archive and its SHA-256 to the tag's GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The session view's build (#327): a pinned Node, checksum-verified (ci/install-node.sh).
  NODE_VERSION: 26.13.1
  NODE_SHA256: "5c063e46bab0fbc1c17cc445d7ff129cbdcd0471be6ed83b6ab864f8143bc864" # node-v26.13.1-linux-x64.tar.xz, from nodejs.org/dist/v26.13.1/SHASUMS256.txt (its signature checked against nodejs/release-keys)

jobs:
  release:
    name: Build and attach
    # The oldest supported runner, so the binary's glibc floor (2.35) runs on Ubuntu 24.04 and
    # Debian 12 (2.36) alike.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag is the workspace's version
        id: version
        run: |
          v=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          [ -n "$v" ] || { echo "no workspace version"; exit 1; }
          if [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $v"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: rustup show active-toolchain
      # The console's session view (#327), built from its lockfile and embedded by build.rs.
      - name: Node (pinned)
        run: ci/install-node.sh
      - name: The session view's bundle
        run: |
          d=$(ci/session-view.sh)
          echo "WICKET_SESSION_VIEW=$d" >>"$GITHUB_ENV"
          # The serve tests then check that the binary has the view, not the placeholder.
          echo "WICKET_SESSION_VIEW_REQUIRED=1" >>"$GITHUB_ENV"
      - run: cargo build --release --locked -p wicket-cli
      - name: Package
        run: ci/package.sh target/release/wicket dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "wicket $V" --notes "wicket $V. Install: see the README."
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/wicket-$V-x86_64-linux.tar.gz dist/wicket-$V-x86_64-linux.tar.gz.sha256
