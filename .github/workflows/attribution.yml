name: No AI attribution

# Commit messages, and the pull request's title and body, carry no AI attribution (no assistant
# Co-Authored-By trailers, "Generated with" footers or session links): ci/no-attribution.py. Its own
# workflow, so editing the body reruns only this.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions:
  contents: read

jobs:
  attribution:
    name: No AI attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the checker's own tests
        run: python3 -I ci/no-attribution_test.py
      - name: commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: python3 -I ci/no-attribution.py --range "$BASE..$HEAD"
      - name: the pull request's title and body
        if: github.event_name == 'pull_request'
        # Read from the event payload file, never interpolated into the script.
        run: python3 -I ci/no-attribution.py --event "$GITHUB_EVENT_PATH"
