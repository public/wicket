# What the gVisor jobs in ci.yml (the smoke test and acceptance, #460) each need before their
# suites: Rust's cache, gVisor as a Docker runtime, the debug `wicket` and the static HTTP/3 client.
# After actions/checkout. The agent image is each job's own next step (`wicket image`), so its time
# shows on its own (#219): the jobs API reports this composite action as one step.
name: gVisor and wicket
description: Install gVisor as a Docker runtime; build wicket and the HTTP/3 client.
inputs:
  save-cache:
    description: Whether this job saves Rust's cache (one of the jobs sharing it does).
    default: "false"
runs:
  using: composite
  steps:
    # What the static HTTP/3 client is built from: rustc's version and every file under ci/h3get but
    # its target dir. Part of the cache's key, so a cache is saved with the client built from them.
    - id: h3get
      name: The HTTP/3 client's stamp
      shell: bash
      run: |
        stamp=$({ rustc -vV; find ci/h3get -path ci/h3get/target -prune -o -type f -print | LC_ALL=C sort | xargs sha256sum; } | sha256sum | cut -d' ' -f1)
        echo "stamp=$stamp" >>"$GITHUB_OUTPUT"
    # Keyed on Cargo.toml too: rust-cache's own key stayed the same through #524's [profile] change,
    # so every run restored the old build, rebuilt all of it, and never saved (an exact hit).
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        # The smoke job's cache, as before the split; the acceptance job reads it. With a shared key,
        # rust-cache ignores `key`, so the stamp and Cargo.toml's hash go in the shared key.
        shared-key: smoke-h3get-${{ steps.h3get.outputs.stamp }}-${{ hashFiles('Cargo.toml') }}
        save-if: ${{ inputs.save-cache == 'true' }}
        # The static HTTP/3 client as last built, with its stamp (below).
        cache-directories: ~/.cache/wicket-h3get
    - name: Install gVisor as a Docker runtime
      shell: bash
      run: |
        # gVisor's release archive, pinned by version and sha512 (#219): no apt repository, whose
        # mid-sync retries (20, 40 and 60 s sleeps) made this step 255-359 s on some runs, against
        # about 90 s; and the same runsc in every job. A release has no bare runsc binary any more,
        # only gvisor.tar.bz2 (and .zstd) with their .sha512 files, and no signature. The sha512 is
        # kept here, never fetched at run time from the server that serves the archive (#722). To
        # update: the version, and the sha512 of the archive, compared with the release's
        # gvisor.tar.bz2.sha512 by whoever updates it (docs/explanation/supply-chain.md).
        version=20261116.0
        # From the release's published gvisor.tar.bz2.sha512 (checked against it on #566's run).
        sha512=c87d792d5842efb70c38ee822124cfe0821a547715e7abcf3f2b14997cd02784edaa0b91e238ec5c27a25a1b9e00bf98113398eb62a0778d8d20d4e222f8b0e0
        url=https://storage.googleapis.com/gvisor/releases/release/$version/x86_64/gvisor.tar.bz2
        dl=$(mktemp -d)
        curl -fsSL --retry 4 --retry-delay 5 --retry-all-errors -o "$dl/gvisor.tar.bz2" "$url"
        [ -n "$sha512" ] || { echo "::error::no sha512 pinned for gVisor $version"; exit 1; }
        echo "$sha512  $dl/gvisor.tar.bz2" | sha512sum -c -
        # What the archive holds, for the log; then its one runsc, wherever it sits in it.
        listing=$(tar -tjf "$dl/gvisor.tar.bz2")
        echo "$listing"
        tar -xjf "$dl/gvisor.tar.bz2" -C "$dl"
        mapfile -t found < <(find "$dl" -type f -name runsc)
        [ "${#found[@]}" = 1 ] || { echo "gvisor.tar.bz2 holds ${#found[@]} runsc binaries: ${found[*]}" >&2; exit 1; }
        # runsc starts its sentry (and the rest) from gvisor-bin/ beside itself, as the .deb installs
        # them (#566: "sidecar gvisor_sentry not usable: stat /usr/bin/gvisor-bin/gvisor_sentry").
        bin=$(dirname "${found[0]}")
        [ -d "$bin/gvisor-bin" ] || { echo "gvisor.tar.bz2 has no gvisor-bin/ beside runsc" >&2; exit 1; }
        sudo install -m 0755 "${found[0]}" /usr/bin/runsc
        sudo rm -rf /usr/bin/gvisor-bin
        sudo cp -a "$bin/gvisor-bin" /usr/bin/gvisor-bin
        sudo chown -R root:root /usr/bin/gvisor-bin
        rm -r "$dl"
        # Keep the runner's own Docker settings; add runsc with host unix sockets (wicket's proxies).
        cfg=/etc/docker/daemon.json
        [ -f "$cfg" ] || echo '{}' | sudo tee "$cfg" >/dev/null
        # Docker Hub pulls (busybox below, the agent image's base images) through Google's
        # unauthenticated mirror first (#219): Hub's anonymous rate limit once failed this setup.
        jq '.runtimes.runsc = {path: "/usr/bin/runsc", runtimeArgs: ["--host-uds=open"]} | ."registry-mirrors" = ((."registry-mirrors" // []) + ["https://mirror.gcr.io"] | unique)' "$cfg" | sudo tee "$cfg.new" >/dev/null
        sudo mv "$cfg.new" "$cfg"
        sudo systemctl restart docker
        # sed reads all of it: with head, runsc could write after head exits and die of SIGPIPE,
        # which pipefail turns into a failed step (exit 141).
        runsc --version | sed -n 1p
        docker info --format 'runtimes: {{range $k, $v := .Runtimes}}{{$k}} {{end}}'
        # A self-test before the suites, whose failure says why (#566: boxes didn't start on the
        # archive's runsc): runsc on its own, then a container through Docker. On a failure, what
        # failed goes into an annotation, with runsc's debug log and Docker's journal.
        dbg=$(mktemp -d)
        say() { printf '%s' "$1" | tail -c 3500 | sed 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }'; }
        if ! out=$(sudo runsc --debug --debug-log="$dbg/" --network=none do true 2>&1); then
          echo "::error title=runsc do true failed::$(say "version: $(runsc --version 2>&1 | head -2); listing: $listing; $out; log: $(sudo sh -c "tail -n 40 $dbg/*" 2>&1)")"
          exit 1
        fi
        if ! out=$(sudo docker run --rm --runtime=runsc --network=none busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662 true 2>&1); then
          echo "::error title=docker run --runtime=runsc failed::$(say "version: $(runsc --version 2>&1 | head -2); listing: $listing; $out; journal: $(sudo journalctl -u docker -n 30 --no-pager 2>&1)")"
          exit 1
        fi
        echo "runsc self-test: ok"
        sudo rm -rf "$dbg"
    - name: Build wicket
      shell: bash
      run: cargo build -p wicket-cli --locked
    # The static HTTP/3 client (the smoke test and acceptance): Rust's musl target, musl-tools and a
    # release build, 27-45 s, unless the cache holds the binary with the same stamp. A cache
    # restored from an older key can hold another stamp's: then it is built again.
    - name: The static HTTP/3 client (h3get, for musl)
      shell: bash
      env:
        STAMP: ${{ steps.h3get.outputs.stamp }}
      run: |
        out=ci/h3get/target/x86_64-unknown-linux-musl/release/h3get
        kept=$HOME/.cache/wicket-h3get
        stamp=$STAMP
        if [ -x "$kept/h3get" ] && [ "$(cat "$kept/stamp" 2>/dev/null)" = "$stamp" ]; then
          echo "h3get: from the cache, built from these sources ($stamp)"
          mkdir -p "$(dirname "$out")"
          cp "$kept/h3get" "$out"
        else
          echo "h3get: building ($stamp)"
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get install -y -q musl-tools
          cargo build -q --release --locked --target x86_64-unknown-linux-musl --manifest-path ci/h3get/Cargo.toml
          mkdir -p "$kept"
          cp "$out" "$kept/h3get"
          echo "$stamp" >"$kept/stamp"
        fi
