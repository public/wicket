[workspace]
resolver = "2"
# Vendored third-party crates (the patched Biscuit fork) are path dependencies, not members: workspace
# lint and test runs cover wicket's own code only.
exclude = ["third_party", "ci/h3get", "ci/determinator"]
members = [
    "crates/wicket-core",
    "crates/wicket-store",
    "crates/wicket-identity",
    "crates/wicket-proxy",
    "crates/wicket-sandbox",
    "crates/wicket-agent",
    "crates/wicket-chan",
    "crates/wicket-home",
    "crates/wicket-node",
    "crates/wicket-gateway",
    "crates/wicket-control",
    "crates/wicket-cli",
    "crates/wicket-authz",
    "crates/wicket-feed",
    "crates/wicket-placement",
    "crates/wicket-fwd",
    "crates/wicket-policy",
    "crates/wicket-policy-diff",
    "crates/wicket-sim",
    "crates/wicket-names",
    "crates/wicket-sources",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
# The console's JavaScript is minified at build time by these (crates/wicket-cli/build.rs, #574): the
# Oxc toolchain as Rust crates, so `cargo build` needs no Node. Pinned exactly: 0.x releases weekly
# and moves its API.
oxc_allocator = "=0.158.0"
oxc_codegen = "=0.158.0"
oxc_diagnostics = "=0.158.0"
oxc_minifier = "=0.158.0"
oxc_parser = "=0.158.0"
oxc_span = "=0.158.0"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: floats parse exactly, so a number wicket reads writes back as itself (the vault_ref
# fuzz target found `42e66` read inexactly and drift on every rewrite, #326).
serde_json = { version = "1", features = ["float_roundtrip"] }
socket2 = "0.6"
serde-saphyr = { version = "2.1", default-features = false, features = ["serialize", "deserialize"] }
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
futures-util = "0.3"
# WebSocket framing for the console's ACP session endpoint (#327): no TLS or client connector of its own
# (the console's rustls stack carries it), only the handshake helpers.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
rusqlite = { version = "0.43", features = ["bundled", "cache"], default-features = false }
sha2 = "0.11"
hex = "0.4"
# Without its `std` feature, which brings rand 0.9 (a second rand, #219): ids come from
# `wicket_core::new_ulid`, with the OS's randomness.
ulid = { version = "1", default-features = false }
globset = "0.4"
url = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["formatting", "macros"] }
# Time zones for triggers' schedules (#578), from the host's zoneinfo: no bundled database.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
getrandom = "0.4"
base64 = "0.22"
# HTTP/3 (#92). ring everywhere, as rustls above; quinn's default provider would be aws-lc-rs.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
webpki-roots = "1"
libc = "0.2"
wicket-core = { path = "crates/wicket-core" }
wicket-store = { path = "crates/wicket-store" }
wicket-identity = { path = "crates/wicket-identity" }
wicket-proxy = { path = "crates/wicket-proxy" }
wicket-chan = { path = "crates/wicket-chan" }
wicket-home = { path = "crates/wicket-home" }
wicket-node = { path = "crates/wicket-node" }
wicket-gateway = { path = "crates/wicket-gateway" }
wicket-control = { path = "crates/wicket-control" }
wicket-sandbox = { path = "crates/wicket-sandbox" }
wicket-agent = { path = "crates/wicket-agent" }
wicket-feed = { path = "crates/wicket-feed" }
wicket-authz = { path = "crates/wicket-authz" }
wicket-placement = { path = "crates/wicket-placement" }
wicket-fwd = { path = "crates/wicket-fwd" }
wicket-policy = { path = "crates/wicket-policy" }
wicket-names = { path = "crates/wicket-names" }
wicket-sources = { path = "crates/wicket-sources" }

[profile.release]
debug = 1

# #219: development and test builds keep line tables for wicket's own crates (file and line in
# panics and backtraces) and no debug info for dependencies: smaller objects, faster links, less
# memory (experiments/build-times). Release builds (`[profile.release]`, #190) are unaffected.
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false
# Dependencies (never wicket's own crates, which stay unoptimized and quick to rebuild) at level 1:
# the tests spend most of their time in them (tokio, turmoil, rusqlite's SQLite, serde, the
# crypto), and CI builds them only when its cache misses. Measured: the workspace's tests 182 s ->
# 149 s, the simulation, store and Cedar tests 131 s -> 103 s; a cold build of the dependencies
# 148 s at -j4; a rebuild after a change to wicket-core 39 s -> 31 s. #51's Cedar differential
# (wicket-policy's tests/cedar.rs) had its two crates at 1 for this reason (#219, at 2 they were
# the longest part of a clean build of wicket-cli).
opt-level = 1

# The authz tests run the Biscuit fork's generic engine on 100k requests (and verify many Ed25519
# signatures); unoptimized, that takes minutes. Optimizing these dependencies keeps `cargo test` fast
# without changing what is tested (limits are step counts, not time).
[profile.dev.package.biscuit-auth]
opt-level = 2
[profile.dev.package.biscuit-parser]
opt-level = 2
[profile.dev.package.regex-automata]
opt-level = 2
[profile.dev.package.regex-syntax]
opt-level = 2
[profile.dev.package.curve25519-dalek]
opt-level = 2
[profile.dev.package.ed25519-dalek]
opt-level = 2
[profile.dev.package.sha2]
opt-level = 2
[profile.dev.package.prost]
opt-level = 2
[profile.dev.package.globset]
opt-level = 2

# Proc-macros and build tools at level 0 (#219): the `"*"` entry above outranks cargo's
# `build-override`, so without these it optimizes code that only generates code. Measured: a clean
# `cargo build --workspace --all-targets` 375 s -> 323 s at -j2 (experiments/build-times); wicket's
# own crates compile no slower. ci/determinator's `host_only_crates_are_at_opt_level_0` keeps the
# list to every proc-macro the build has, and to crates built only for the host.
[profile.dev.package]
asn1-rs-derive = { opt-level = 0 }
asn1-rs-impl = { opt-level = 0 }
async-recursion = { opt-level = 0 }
async-trait = { opt-level = 0 }
clap_derive = { opt-level = 0 }
curve25519-dalek-derive = { opt-level = 0 }
darling_core = { opt-level = 0 }
darling_macro = { opt-level = 0 }
displaydoc = { opt-level = 0 }
educe = { opt-level = 0 }
enum-ordinalize-derive = { opt-level = 0 }
futures-macro = { opt-level = 0 }
jiff-static = { opt-level = 0 }
jni-macros = { opt-level = 0 }
jni-sys-macros = { opt-level = 0 }
lalrpop = { opt-level = 0 }
lazy-regex-proc_macros = { opt-level = 0 }
logos-derive = { opt-level = 0 }
miette-derive = { opt-level = 0 }
multiversion_no_op = { opt-level = 0 }
oxc_ast_macros = { opt-level = 0 }
phf_macros = { opt-level = 0 }
prost-derive = { opt-level = 0 }
ref-cast-impl = { opt-level = 0 }
rustversion = { opt-level = 0 }
seq-macro = { opt-level = 0 }
serde_derive = { opt-level = 0 }
serde_with_macros = { opt-level = 0 }
syn = { opt-level = 0 }
synstructure = { opt-level = 0 }
thiserror-impl = { opt-level = 0 }
time-macros = { opt-level = 0 }
tokio-macros = { opt-level = 0 }
tracing-attributes = { opt-level = 0 }
wasm-bindgen-macro = { opt-level = 0 }
windows-implement = { opt-level = 0 }
windows-interface = { opt-level = 0 }
yoke-derive = { opt-level = 0 }
zerocopy-derive = { opt-level = 0 }
zerofrom-derive = { opt-level = 0 }
zerovec-derive = { opt-level = 0 }
