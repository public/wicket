[workspace]
resolver = "2"
# Vendored third-party crates (the patched Biscuit fork) are path dependencies, not members: workspace
# lint and test runs cover wicket's own code only.
exclude = ["third_party"]
members = [
    "crates/wicket-core",
    "crates/wicket-store",
    "crates/wicket-auth",
    "crates/wicket-identity",
    "crates/wicket-proxy",
    "crates/wicket-sandbox",
    "crates/wicket-agent",
    "crates/wicket-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
ulid = "1"
globset = "0.4"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["formatting", "macros"] }
humantime = "2"
wicket-core = { path = "crates/wicket-core" }
wicket-store = { path = "crates/wicket-store" }
wicket-auth = { path = "crates/wicket-auth" }
wicket-identity = { path = "crates/wicket-identity" }
wicket-proxy = { path = "crates/wicket-proxy" }
wicket-sandbox = { path = "crates/wicket-sandbox" }
wicket-agent = { path = "crates/wicket-agent" }

[profile.release]
debug = 1
