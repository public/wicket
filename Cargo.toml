[workspace]
resolver = "2"
# Vendored third-party crates (the patched Biscuit fork) are path dependencies, not members: workspace
# lint and test runs cover wicket's own code only.
exclude = ["third_party", "ci/h3get"]
members = [
    "crates/wicket-core",
    "crates/wicket-store",
    "crates/wicket-auth",
    "crates/wicket-identity",
    "crates/wicket-proxy",
    "crates/wicket-sandbox",
    "crates/wicket-agent",
    "crates/wicket-cli",
    "crates/wicket-authz",
    "crates/wicket-feed",
    "crates/wicket-placement",
    "crates/wicket-fwd",
    "crates/wicket-policy",
    "crates/wicket-policy-diff",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", features = ["x509-parser"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
ulid = "1"
globset = "0.4"
url = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["formatting", "macros"] }
humantime = "2"
getrandom = "0.2"
base64 = "0.22"
# HTTP/3 (#92). ring everywhere, as rustls above; quinn's default provider would be aws-lc-rs.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
webpki-roots = "1"
libc = "0.2"
wicket-core = { path = "crates/wicket-core" }
wicket-store = { path = "crates/wicket-store" }
wicket-auth = { path = "crates/wicket-auth" }
wicket-identity = { path = "crates/wicket-identity" }
wicket-proxy = { path = "crates/wicket-proxy" }
wicket-sandbox = { path = "crates/wicket-sandbox" }
wicket-agent = { path = "crates/wicket-agent" }
wicket-feed = { path = "crates/wicket-feed" }
wicket-authz = { path = "crates/wicket-authz" }
wicket-placement = { path = "crates/wicket-placement" }
wicket-fwd = { path = "crates/wicket-fwd" }
wicket-policy = { path = "crates/wicket-policy" }

[profile.release]
debug = 1

# #219: development and test builds keep line tables for wicket's own crates (file and line in
# panics and backtraces) and no debug info for dependencies: smaller objects, faster links, less
# memory (experiments/build-times). Release builds (`[profile.release]`, #190) are unaffected.
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false

# The authz tests run the Biscuit fork's generic engine on 100k requests (and verify many Ed25519
# signatures); unoptimized, that takes minutes. Optimizing these dependencies keeps `cargo test` fast
# without changing what is tested (limits are step counts, not time).
[profile.dev.package.biscuit-auth]
opt-level = 2
[profile.dev.package.biscuit-parser]
opt-level = 2
[profile.dev.package.regex-automata]
opt-level = 2
[profile.dev.package.regex-syntax]
opt-level = 2
[profile.dev.package.curve25519-dalek]
opt-level = 2
[profile.dev.package.ed25519-dalek]
opt-level = 2
[profile.dev.package.sha2]
opt-level = 2
[profile.dev.package.prost]
opt-level = 2
[profile.dev.package.globset]
opt-level = 2
# #51's differential test (wicket-policy's tests/cedar.rs) runs Cedar's parser, validator and
# authorizer on thousands of generated policies and requests: unoptimized, minutes.
[profile.dev.package.cedar-policy]
opt-level = 2
[profile.dev.package.cedar-policy-core]
opt-level = 2
