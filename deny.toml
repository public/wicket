# cargo deny (#326): advisories, licences, duplicate and banned crates, and where crates come from.
# CI runs `cargo deny --locked check` on every pull request (.github/workflows/ci.yml, `deny`).
# Locally: cargo install --locked cargo-deny@0.20.2, then the same command.

[graph]
# The platforms wicket builds for: Linux, x86_64 and aarch64 (a dependency for another OS only
# isn't shipped).
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-gnu"]
all-features = true

[advisories]
# The RustSec database: any vulnerability, unsoundness or yanked version fails the check. An
# advisory wicket has looked at and accepts goes in `ignore` with its id and why.
yanked = "deny"
ignore = [
    # unsafe-libyaml (serde_yaml's parser) is unmaintained. The exposure: YAML an agent influences is
    # parsed host-side, by the control host, as its spawned children's manifests (written from the
    # zone it asks for, re-read at start and when a child its node started is adopted) and as
    # manifests generally (`wicket_agent::load`). The fuzz target `manifest` (fuzz/fuzz_targets/
    # manifest.rs, ci/fuzz.sh) drives that same path (parse, compile, subset admission) nightly.
    # Replacing serde_yaml is its own change (#326's notes): until then, accepted.
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained; agent-influenced YAML (spawned zones, manifests) is parsed host-side and fuzzed by the `manifest` target; replacing serde_yaml is a change of its own" },
]

[licenses]
# Permissive licences only, as wicket itself is MIT (and the session view's npm
# bundle is held to the same list by ci/session-view.sh).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates aren't published.
ignore = true

[bans]
# Duplicate versions are #219's to remove: reported, not failed, until it lands.
multiple-versions = "warn"
# A dependency on any version (`*`) is refused.
wildcards = "deny"
allow-wildcard-paths = true
# OpenSSL is never linked: TLS is rustls (ring) everywhere.
deny = [
    { crate = "openssl", reason = "TLS is rustls" },
    { crate = "openssl-sys", reason = "TLS is rustls" },
    { crate = "native-tls", reason = "TLS is rustls" },
]

[sources]
# crates.io only: no git dependency, no other registry. The vendored biscuit fork is a path.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
