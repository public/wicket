# cargo-nextest (#218), a development and CI tool: not a dependency of wicket.
# `ci/gates.sh` runs `cargo nextest run --profile ci`.

[profile.default]
# Report slow tests; they are what to fix first.
slow-timeout = { period = "60s" }

[profile.ci]
# A test that fails and then passes on a retry is reported as FLAKY in the run's output and in the
# JUnit report: never silently passing. Two retries at most.
retries = 2
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }
status-level = "slow"
final-status-level = "flaky"

[profile.ci.junit]
path = "junit.xml"
