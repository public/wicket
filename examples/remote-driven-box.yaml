# A box wicket drives that is also a Remote Control session (#285): Claude Code runs driven, as in
# any wicket box (the task below is its first turn; session prompts, messages and wakes are its next
# ones; it hibernates and wakes), and registers its session in your Claude apps, where you watch it
# and can send it messages. See docs/how-to/drive-a-box-from-the-claude-apps.md.
#
#   wicket secret link claude-login --file ~/.claude/.credentials.json \
#       --pointer /claudeAiOauth/accessToken --expires-pointer /claudeAiOauth/expiresAt --hosts api.anthropic.com
#   wicket run examples/remote-driven-box.yaml
#
# As in examples/remote-control-box.yaml, `claude-login` is your full claude.ai login, which the box
# only holds as a placeholder: the egress proxy swaps the real one in toward api.anthropic.com, on the
# paths below only. Remote Control runs only against api.anthropic.com with that login, so the model
# calls go there too (through the egress proxy, with zone.llm's budget), not to wicket's model proxy.
task: |
  Write a short haiku about sandboxes to /workspace/out/haiku.txt, then wait for messages.
agent:
  name: rc-driven
  # The permission mode defaults to bypassPermissions, as in any driven box: a driven Claude Code
  # asks wicket, not the app, before an action that needs approval, so `default` is refused.
  # wicket's proxies decide what the box can reach whatever the mode.
  remote: { name: wicket-driven-box, drive: true }
zone:
  name: remote-driven-box
  isolation: gvisor
  reach:
    # Model calls.
    - { host: api.anthropic.com, methods: [POST], paths: ["/v1/messages", "/v1/messages/count_tokens"] }
    # Remote Control from a driven session: creating its session and its bridge credentials, the
    # session's worker channel (its events, state, heartbeat, and the stream the app's messages
    # arrive on), the session's own metadata, and archiving it at the end. Listing the account's
    # sessions stays outside reach.
    - { host: api.anthropic.com, methods: [POST], paths: ["/v1/code/sessions", "/v1/code/sessions/*/bridge", "/v1/sessions/*/archive"] }
    # A woken box resumes its session (#330): Claude Code unarchives it (the session's id, in either
    # of its forms), then fetches its bridge credentials again (above), so the app keeps the same
    # conversation. Like archiving, the glob can't tell the box's session from the account's others
    # (the zone is fixed before the box learns its session's id), so it takes knowing the id.
    - { host: api.anthropic.com, methods: [POST], paths: ["/v1/sessions/*/unarchive", "/v1/code/sessions/*/unarchive"] }
    - { host: api.anthropic.com, methods: [GET, POST, PUT], paths: ["/v1/code/sessions/*/worker", "/v1/code/sessions/*/worker/**"] }
    - { host: api.anthropic.com, methods: [GET], paths: ["/v1/code/sessions/*"] }
    # The account's profile and Claude Code's start-up settings.
    - { host: api.anthropic.com, methods: [GET], paths: ["/api/oauth/profile", "/api/claude_cli/bootstrap"] }
  forbid:
    # Your claude.ai connectors would hand the box your account-wide tools, and refreshing the login
    # is the host's job: never.
    - { host: mcp-proxy.anthropic.com }
    - { host: api.anthropic.com, paths: ["/v1/mcp_servers", "/v1/mcp_servers/**", "/v2/ccr-sessions/*/mcp", "/mcp-registry/**"] }
    - { host: platform.claude.com, paths: ["/v1/oauth/token"] }
    # Account settings a box has no use for, refused quietly rather than waiting for you at every
    # start: the consumer-terms notice (grove), the organization's fast mode (penguin mode), and
    # guest-pass referrals. Claude Code carries on without each.
    - { host: api.anthropic.com, paths: ["/api/claude_code_grove", "/api/claude_code_penguin_mode", "/api/oauth/organizations/*/referral/eligibility"] }
  llm:
    secret: claude-login
    max_requests: 3000
    max_output_tokens: 3000000
  limits: { memory: 2g, cpus: 1, timeout: 2h }
