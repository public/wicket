# A real run: Claude Code reads a public GitHub repository through wicket's proxies.
task: |
  Find out what the GitHub repository octocat/Hello-World contains: use the GitHub REST API at
  https://api.github.com (for example /repos/octocat/Hello-World and its contents and commits),
  or clone it with git. Then also try to read https://example.com/ (it is outside your allowed
  reach, so it needs a human's approval). Write your findings to /workspace/out/result.json.
agent:
  name: explorer
  max_turns: 20
zone:
  name: research
  isolation: gvisor
  reach:
    - { host: api.github.com, paths: ["/repos/octocat/Hello-World", "/repos/octocat/Hello-World/**"] }
    - { host: github.com, methods: [GET, POST], paths: ["/octocat/Hello-World/info/refs", "/octocat/Hello-World/git-upload-pack", "/octocat/Hello-World.git/info/refs", "/octocat/Hello-World.git/git-upload-pack"] }
  llm:
    secret: claude-oauth   # subscription token from `claude setup-token`; never an API key
    max_requests: 60
    max_output_tokens: 60000
  limits: { memory: 2g, cpus: 1, timeout: 15m }
