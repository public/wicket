# A Claude Code session you drive live from the Claude app (Remote Control), running inside a wicket
# box. See README.md. The task text is unused: your messages come from the app.
task: Remote Control session.
agent:
  name: rc-agent
zone:
  name: remote-control
  isolation: gvisor
  reach:
    # The session itself, on Anthropic's API: model calls and the Remote Control worker channel. The box
    # holds only placeholders for the account login and the session token; wicket's egress proxy swaps
    # in the real ones for this host alone. Paths are the ones a real session used (design §14.1, E-RC3).
    - { host: api.anthropic.com, methods: [POST], paths: ["/v1/messages", "/v1/messages/count_tokens"] }
    - { host: api.anthropic.com, methods: [GET, PUT, POST], paths: ["/v1/code/sessions/*/worker", "/v1/code/sessions/*/worker/**"] }
    - { host: api.anthropic.com, paths: ["/api/oauth/profile", "/api/claude_cli/bootstrap", "/api/claude_code_penguin_mode", "/api/web/domain_info"] }
    # Something to try: reads here are allowed; anything else waits for your approval.
    - { host: example.com }
  forbid:
    # The account's claude.ai connectors would hand the sandbox your account-wide tools: never.
    - { host: mcp-proxy.anthropic.com }
    - { host: api.anthropic.com, paths: ["/v1/mcp_servers", "/v1/mcp_servers/**", "/mcp-registry/**"] }
  llm:
    secret: claude-oauth   # the host's Claude login, by reference (wicket secret link)
    # The session's model calls are metered at the egress proxy: a budget sized for a 2-hour session.
    max_requests: 3000
    max_output_tokens: 3000000
  limits: { memory: 2g, cpus: 1, timeout: 2h }
