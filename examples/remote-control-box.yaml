# A box that is its own Remote Control session (#169): Claude Code boots in the box as
# `claude remote-control`, registers the session with your account, and you drive it from the Claude
# apps (desktop, web, phone). See docs/agents.md ("Remote sessions").
#
#   wicket secret link claude-login --file ~/.claude/.credentials.json \
#       --pointer /claudeAiOauth/accessToken --expires-pointer /claudeAiOauth/expiresAt --hosts api.anthropic.com
#   wicket run examples/remote-control-box.yaml
#
# `claude-login` is your full claude.ai login (it can list and drive your sessions), unlike a
# `claude setup-token` inference token: the box never holds it. The box gets a placeholder login that
# wicket's egress proxy swaps for the real access token toward api.anthropic.com, on the paths below
# only; Claude Code on the host keeps refreshing the real one, and the refresh token never leaves the
# host.
agent:
  name: rc-box
  remote: { name: wicket-box }
zone:
  name: remote-control-box
  isolation: gvisor
  reach:
    # Model calls; and Remote Control: the session's own environment and its work, the session's
    # worker channel.
    - { host: api.anthropic.com, methods: [POST], paths: ["/v1/messages", "/v1/messages/count_tokens"] }
    - { host: api.anthropic.com, methods: [GET, POST, PUT], paths: ["/v1/environments/bridge", "/v1/environments/bridge/*/offline", "/v1/environments/*/work/**", "/v1/code/sessions/*/worker", "/v1/code/sessions/*/worker/**"] }
    # The account's profile and Claude Code's start-up settings.
    - { host: api.anthropic.com, methods: [GET], paths: ["/api/oauth/profile", "/api/claude_cli/bootstrap"] }
    # Something to try: reads here are allowed; anything else waits for your approval.
    - { host: example.com }
  forbid:
    # Your claude.ai connectors would hand the box your account-wide tools, and refreshing the login
    # is the host's job (the box has no refresh token to offer): never. Anything else outside reach
    # (other sessions, triggers, memory) waits for your approval, so deny those.
    - { host: mcp-proxy.anthropic.com }
    - { host: api.anthropic.com, paths: ["/v1/mcp_servers/**", "/mcp-registry/**"] }
    - { host: platform.claude.com, paths: ["/v1/oauth/token"] }
  llm:
    secret: claude-login
    max_requests: 3000
    max_output_tokens: 3000000
  limits: { memory: 2g, cpus: 1, timeout: 2h }
