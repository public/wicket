# A box that is its own Remote Control session (#169): Claude Code boots in the box as
# `claude remote-control`, registers the session with your account, and you drive it from the Claude
# apps (desktop, web, phone). See docs/reference/agents.md ("Remote sessions").
#
#   wicket secret link claude-login --file ~/.claude/.credentials.json \
#       --pointer /claudeAiOauth/accessToken --expires-pointer /claudeAiOauth/expiresAt --hosts api.anthropic.com
#   wicket run examples/remote-control-box.yaml
#
# The link also keeps your login's account fields (organization and account ids, plan, roles; not
# your name) from ~/.claude.json, which Remote Control needs: re-link after switching accounts.
#
# `claude-login` is your full claude.ai login (it can list and drive your sessions), unlike a
# `claude setup-token` inference token: the box never holds it. The box gets a placeholder login that
# wicket's egress proxy swaps for the real access token toward api.anthropic.com, on the paths below
# only; Claude Code on the host keeps refreshing the real one, and the refresh token never leaves the
# host.
agent:
  name: rc-box
  # Add `permission_mode: bypassPermissions` for a box nobody watches: `default` asks in the app
  # before each action. wicket's proxies decide what the box can reach whatever the mode.
  remote: { name: wicket-box }
zone:
  name: remote-control-box
  isolation: gvisor
  reach:
    # Model calls; and Remote Control: the session's own environment and its work, the session's
    # worker channel.
    - { host: api.anthropic.com, methods: [POST], paths: ["/v1/messages", "/v1/messages/count_tokens"] }
    - { host: api.anthropic.com, methods: [GET, POST, PUT], paths: ["/v1/environments/bridge", "/v1/environments/bridge/*/offline", "/v1/environments/*/work/**", "/v1/code/sessions/*/worker", "/v1/code/sessions/*/worker/**"] }
    # Reattaching after a dropped connection, and deregistering the environment when the box ends.
    - { host: api.anthropic.com, methods: [POST], paths: ["/v1/environments/*/bridge/reconnect"] }
    - { host: api.anthropic.com, methods: [DELETE], paths: ["/v1/environments/bridge/*"] }
    # The session itself (#298): creating it, its title and state, its events, archiving it at the
    # end. Listing the account's sessions (GET /v1/sessions) stays outside reach.
    - { host: api.anthropic.com, methods: [POST], paths: ["/v1/sessions", "/v1/sessions/*/events", "/v1/sessions/*/archive"] }
    - { host: api.anthropic.com, methods: [GET, PATCH], paths: ["/v1/sessions/*"] }
    # The session's own metadata (its state and title), read back by id. Like `/v1/sessions/*`
    # above, the glob can't tell the box's session from the account's others, so reading a session
    # takes knowing its id; listing them stays outside reach.
    - { host: api.anthropic.com, methods: [GET], paths: ["/v1/code/sessions/*"] }
    # The account's profile, Claude Code's start-up settings, and checking the login's scopes.
    - { host: api.anthropic.com, methods: [GET], paths: ["/api/oauth/profile", "/api/claude_cli/bootstrap"] }
    - { host: api.anthropic.com, methods: [POST], paths: ["/api/oauth/validate"] }
    # Something to try: reads here are allowed; anything else waits for your approval.
    - { host: example.com }
  forbid:
    # Your claude.ai connectors would hand the box your account-wide tools (listing them, the bare
    # `/v1/mcp_servers`, which `/**` doesn't match; and a session's remote MCP), and refreshing the
    # login is the host's job (the box has no refresh token to offer): never. Anything else outside
    # reach (other sessions, triggers, memory) waits for your approval, so deny those.
    - { host: mcp-proxy.anthropic.com }
    - { host: api.anthropic.com, paths: ["/v1/mcp_servers", "/v1/mcp_servers/**", "/v2/ccr-sessions/*/mcp", "/mcp-registry/**"] }
    - { host: platform.claude.com, paths: ["/v1/oauth/token"] }
    # Account settings a box has no use for, refused quietly rather than waiting for you at every
    # start: the consumer-terms notice (grove, which a box can't answer), the organization's fast
    # mode (penguin mode: the box runs without it), and guest-pass referrals. Claude Code carries on
    # without each.
    - { host: api.anthropic.com, paths: ["/api/claude_code_grove", "/api/claude_code_penguin_mode", "/api/oauth/organizations/*/referral/eligibility"] }
  llm:
    secret: claude-login
    max_requests: 3000
    max_output_tokens: 3000000
  limits: { memory: 2g, cpus: 1, timeout: 2h }
