# Another box on the same node (ci/attack-matrix.sh): it serves a canary on a port it exposes, and
# has a request of its own pending. The attacker may neither reach the port nor decide the request.
task: Serve a canary to nobody.
program:
  name: peer
  command: [bash, /workspace/peer.sh]
zone:
  name: atk-peer
  isolation: gvisor
  reach:
    - { host: example.com, methods: [GET], paths: ["/"] }
  escalation: { request: true }
  limits: { memory: 256m, cpus: 1, timeout: 10m }
