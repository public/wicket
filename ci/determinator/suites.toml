# The suites that aren't a crate's tests (#218), read by ci/determinator: the end-to-end scripts,
# the proofs and models, the fuzz targets. A suite runs when a changed path matches one of its
# `paths` (`*` within a directory, `**` across them), or a crate it names is affected (changed, or
# depending on a changed crate: wicket-cli is affected by nearly every change). A change that marks
# everything (rules.toml) runs every suite, and so does a path no rule or crate claims.
#
# The end-to-end suites (`binary = true`) run the built `wicket`, so a change only to tests (the
# `[tests]` paths) doesn't select them through their packages. smoke and acceptance still list
# wicket-cli: any change to what the binary is built from runs them. The others name what they
# exercise that smoke and acceptance don't (#218): a node change runs the node suites, a change to
# hibernation or the state store runs hibernate and restore, a change to the install path runs
# install-test.

# Files only a crate's tests read (integration tests, benches, test modules and their data, each
# compiled under #[cfg(test)] or read only there): a change to them leaves every binary as it was.
[tests]
paths = [
  "crates/*/tests/**", "crates/*/benches/**",
  "crates/wicket-cli/src/daemon/tests.rs", "crates/wicket-cli/src/serve/tests/**",
  "crates/wicket-cli/src/top/testdata/**", "crates/wicket-feed/src/tests/**",
]

[suite.policy]
packages = ["wicket-policy", "wicket-policy-diff"]
paths = ["examples/policy/**", "ci/policy-diff.sh"]

[suite.lean]
packages = ["wicket-authz"]
paths = ["ci/lean.sh"]

[suite.kani]
packages = ["wicket-core"]
paths = ["ci/kani.sh", "ci/shard.awk"]

# TLC reads only the models (ci/tla.sh): no crate's code reaches it, so only its own paths select it.
# Each README maps the models' actions to the code; a change to that code is reviewed against them,
# but rerunning TLC can't catch a drift.
[suite.tla]
paths = ["verification/tla/**", "ci/tla.sh", "ci/tla-trail.py", "ci/shard.awk"]

[suite.smoke]
binary = true
packages = ["wicket-cli", "wicket-fwd"]
paths = ["ci/smoke.sh", "ci/smoke.yaml", "ci/h3get/**", "images/**", "ci/attack-matrix.sh", "ci/attack/**"]

# Hibernation and its stores: bundles, the content-addressed store, git guards, the transcript a
# woken agent resumes from.
[suite.hibernate]
binary = true
packages = ["wicket-store"]
paths = [
  "ci/hibernate.sh", "ci/hibernate.yaml",
  "crates/wicket-control/src/hibernate.rs", "crates/wicket-control/src/snapstore.rs",
  "crates/wicket-control/src/storegc.rs", "crates/wicket-control/src/gitguard.rs",
  "crates/wicket-control/src/transcript.rs",
]

# Per-node services (#579 step 3): the npm cache example installed, kept on its node, and used
# by boxes through their links.
[suite.services]
binary = true
packages = ["wicket-store"]
paths = [
  "ci/service-e2e.sh", "examples/services/**",
  "crates/wicket-control/src/services.rs", "crates/wicket-store/src/services.rs", "crates/wicket-core/src/service.rs",
  "crates/wicket-gateway/src/link.rs", "crates/wicket-cli/src/cmd/service.rs",
]

# Control-plane state off the host (#154): the ledger streamed to S3, the recovery kit, the roots
# taken offline, a standby restored, and the hibernated agent's bundle there.
[suite.restore]
binary = true
packages = ["wicket-store"]
paths = [
  "ci/restore.sh",
  "crates/wicket-control/src/hibernate.rs", "crates/wicket-control/src/snapstore.rs",
  "crates/wicket-control/src/storegc.rs", "crates/wicket-control/src/roots.rs",
  "crates/wicket-home/src/s3.rs", "crates/wicket-home/src/statestore.rs", "crates/wicket-home/src/audit_export.rs",
  "crates/wicket-cli/src/state.rs",
]

[suite.acceptance]
binary = true
packages = ["wicket-cli"]
paths = ["ci/acceptance.sh", "ci/acceptance/**", "ci/h3get/**", "images/**"]

[suite.daemon-uids]
binary = true
packages = ["wicket-cli"]
paths = ["ci/daemon-uids.sh", "deploy/install.sh"]

# deploy/install.sh from the release archive in a fresh container: the install path, the daemon
# with its users and groups, the units and the root copies the CLI writes, `wicket self`.
[suite.install-test]
binary = true
paths = [
  "ci/install-test.sh", "ci/install-acceptance.sh", "ci/base-images.sh", "ci/package.sh", "deploy/**",
  "crates/wicket-cli/src/daemon/**", "crates/wicket-cli/src/units.rs", "crates/wicket-cli/src/rootcopy.rs",
  "crates/wicket-cli/src/cmd/itself.rs",
]

# Run by local gates and nightly, not on pull requests. The node suites: the node (wicket-node, the
# channel it talks, wicket-chan) and the control host's side of that channel.
[suite.node-e2e]
binary = true
packages = ["wicket-node", "wicket-chan"]
paths = [
  "ci/node-e2e.sh", "ci/node-e2e/**",
  "crates/wicket-control/src/noderun.rs", "crates/wicket-control/src/nodecall.rs",
  "crates/wicket-control/src/enrol.rs",
]

[suite.acceptance-nodes]
binary = true
packages = ["wicket-node", "wicket-chan"]
paths = [
  "ci/acceptance.sh", "ci/acceptance/**",
  "crates/wicket-control/src/noderun.rs", "crates/wicket-control/src/nodecall.rs",
  "crates/wicket-control/src/enrol.rs",
]

[suite.update]
binary = true
packages = ["wicket-cli"]
paths = ["ci/update.sh", "ci/update/**", "deploy/systemd/**"]

# The fuzz targets (#323, fuzz/, its own workspace), each a suite `fuzz-<target>` that ci/fuzz.sh
# runs for a short while. `{t}` in these paths is the target; every target has them. A target's
# packages are the crates its harness links (their dependencies reach it through them).
[fuzz]
paths = [
  "fuzz/*/{t}.rs", "fuzz/corpus/{t}/**", "fuzz/regressions/{t}/**",
  "fuzz/src/lib.rs", "fuzz/tests/**", "fuzz/examples/**", "fuzz/Cargo.toml", "fuzz/Cargo.lock", "ci/fuzz.sh",
]

[fuzz.target]
egress = { packages = ["wicket-proxy", "wicket-store"], paths = ["fuzz/src/util.rs"] }
gateway = { packages = ["wicket-gateway", "wicket-proxy", "wicket-store"], paths = ["fuzz/src/util.rs"] }
chan = { packages = ["wicket-chan"], paths = ["fuzz/src/node_chan.rs"] }
feed = { packages = ["wicket-feed"] }
token = { packages = ["wicket-authz"] }
manifest = { packages = ["wicket-agent", "wicket-policy"] }
store = { packages = ["wicket-store"] }
git = { packages = ["wicket-core"] }
canon = { packages = ["wicket-core"] }
time = { packages = ["wicket-core"] }
vault_ref = { packages = ["wicket-proxy"] }
digest_grant = { packages = ["wicket-store"] }
# Its harness links wicket-control for `Policy::parse` alone: only the parser selects it, not every
# change to wicket-control and the crates under it (its optimized build is the longest of all).
agent_rules = { packages = [], paths = ["crates/wicket-control/src/operators.rs", "crates/wicket-core/src/yaml.rs"] }
