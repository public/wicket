# ci/node-e2e.sh: a program box on a node. example.com is in the node CA's hosts (the node terminates
# and decides it); www.example.org is not (the node forwards it to the control host).
task: probe egress once a second
program:
  name: node-e2e
  command: [bash, probe.sh, "110"]
  source: .
  on_pending: wait
zone:
  name: node-e2e
  isolation: gvisor
  reach:
    - { host: example.com, methods: [GET, POST], paths: ["/"] }
  limits: { memory: 512m, cpus: 1, timeout: 5m }
