# Hibernate and wake (#70, ci/hibernate.sh): a long-lived Claude Code agent in a gVisor box, driven by
# the scripted mock model. Each turn, the mock asks the agent to run /workspace/step.sh; the step's
# output asks for hibernation (`wicket-mock: hibernate`), and the agent calls its hibernate tool.
task: Run the command you are given and stop.
agent:
  name: hib
  max_turns: 6
zone:
  name: ci-hibernate
  isolation: gvisor
  llm:
    secret: mock
    upstream: http://127.0.0.1:9998
    # The agent's budget over its whole life: 3 requests a turn (the step, the hibernate call, the
    # end of the turn), 4 activations (first run, wake, the winning double wake, say). A fifth wake
    # is refused.
    max_requests: 12
  volumes:
    - { name: data, path: /volumes/data, persist: durable }
  limits: { memory: 1500m, cpus: 1, timeout: 5m }
