# Acceptance (ci/acceptance.sh --nodes local): a node on its own (#152, #153). The agent's one turn
# runs drive.sh, which calls the model and the zone's egress every 5 s for as long as its box runs.
# Its control channel is cut for longer than the old 150 s offline window; the box keeps working,
# model calls included (the model credential, `mock-offline`, is sealed to the node), and its node
# stops it when its authority (`limits.authority`, counted from the run's start) expires. While cut
# off, its gateway tools and a narrower spawn are decided on its node (#164).
task: Run the command you are given and stop.
agent:
  name: offline
  max_turns: 4
  max_children: 2
zone:
  name: acc-offline
  isolation: gvisor
  reach:
    - { host: example.com, methods: [GET, POST], paths: ["/"] }
  llm:
    secret: mock-offline
    upstream: http://127.0.0.1:MOCK_PORT
    max_requests: 400
  limits: { memory: 1500m, cpus: 1, timeout: 20m, authority: 5m }
