# Acceptance (ci/acceptance.sh): an ACP agent (#66), wicket its client. The agent (acp/agent.py, no
# model) misbehaves on purpose: file and terminal calls, "always" options, a settings.local.json
# write, a mode change. It records what wicket offered and answered. After its turn it idles, wakes on
# its own timer while wicket leaves it running (#249), then asks to hibernate, and is woken: its own
# session is loaded, and a prompt asked during the replay is not approved. Woken, it asks to finish.
task: Misbehave, then stop.
agent:
  name: acp
  harness: acp
  acp: { command: [python3, /workspace/agent.py] }
zone:
  name: acc-acp
  isolation: gvisor
  limits: { memory: 512m, cpus: 1, timeout: 4m }
