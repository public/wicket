# Acceptance (ci/acceptance.sh): a box whose `wicket run` is killed hard, so `wicket reconcile` has
# an orphan to stop. A program, not an agent: an agent's session reads its stdin and ends with the
# supervisor, while this box keeps running with nothing behind it.
task: Stay up until stopped.
program:
  name: orphan
  command: [sh, -c, "echo acc-orphan-up; exec sleep 600"]
zone:
  name: acc-orphan
  isolation: gvisor
  limits: { memory: 256m, cpus: 1, timeout: 5m }
