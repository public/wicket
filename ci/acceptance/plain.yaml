# Acceptance (ci/acceptance.sh): an agent whose `wicket run` is killed hard, so `wicket reconcile`
# has an orphaned box to stop. Its session stays open after the turn (idle_timeout).
task: Run the command you are given and stop.
agent:
  name: orphan
  max_turns: 4
  idle_timeout: 5m
zone:
  name: acc-orphan
  isolation: gvisor
  llm:
    secret: mock
    upstream: http://127.0.0.1:MOCK_PORT
  limits: { memory: 1500m, cpus: 1, timeout: 5m }
