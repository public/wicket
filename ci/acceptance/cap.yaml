# Acceptance, multi-host (ci/acceptance/nodes.sh): an agent that asks for a node of its own and
# starts a box there. Its session stays open (idle_timeout) until it is revoked.
task: Run the command you are given and stop.
agent:
  name: cap
  max_turns: 4
  max_children: 2
  idle_timeout: 20m
zone:
  name: acc-cap
  isolation: gvisor
  reach:
    - { host: example.com, methods: [GET], paths: ["/"] }
  llm:
    secret: mock
    upstream: http://127.0.0.1:MOCK_PORT
  limits: { memory: 1500m, cpus: 1, timeout: 25m }
