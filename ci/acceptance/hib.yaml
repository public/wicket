# Acceptance (ci/acceptance.sh): a long-lived agent that hibernates after its turn and is woken.
task: Run the command you are given and stop.
agent:
  name: hib
  max_turns: 6
  idle_timeout: 1s
  hibernate_after: 4s
zone:
  name: acc-hibernate
  isolation: gvisor
  llm:
    secret: mock
    upstream: http://127.0.0.1:MOCK_PORT
  volumes:
    - { name: data, path: /volumes/data, persist: durable }
  limits: { memory: 1500m, cpus: 1, timeout: 5m }
