# Acceptance (ci/acceptance.sh): the same flood with on_output_full: stop, so its box is stopped (#151).
task: Write a lot.
program:
  name: flood-stop
  command: [sh, -c, "yes 0123456789abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz | head -c 20000000; echo; echo acc-flood-done; sleep 20"]
zone:
  name: acc-flood-stop
  isolation: gvisor
  limits: { memory: 256m, cpus: 1, timeout: 3m, output: 1m, on_output_full: stop }
