[package]
name = "wicket-sim"
description = "Deterministic simulation of wicket's control host, nodes and boxes (#324): the real feed, decide path and model budget accounting on turmoil's simulated network and clock, with faults from a seed."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wicket-core.workspace = true
wicket-authz.workspace = true
wicket-feed.workspace = true
wicket-store.workspace = true
wicket-proxy = { workspace = true, features = ["sim"] }
# The control host's gateway tools (#257), as a run's supervisor answers them.
wicket-gateway.workspace = true
wicket-placement.workspace = true
wicket-identity.workspace = true
anyhow.workspace = true
turmoil = "0.7"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
ed25519-dalek = "3"
