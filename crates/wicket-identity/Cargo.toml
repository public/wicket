[package]
name = "wicket-identity"
description = "wicket workload identity: an installation issuer, per-agent identity documents (JWS, SPIFFE-style IDs) and signed agent-to-agent envelopes."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ed25519-dalek = { version = "3", features = ["rand_core"] }
getrandom = { workspace = true, features = ["sys_rng"] }
base64 = "0.22"
sha2.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
