[package]
name = "wicket-home"
description = "An installation's home (#219): where its data and keys are, its identity issuer, and who is calling (the principal and the operator). Split from wicket-cli so the modules that need only these build and test without the rest of it."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# nodeauth's test installation, for the tests of the crates that use this one (wicket-cli's).
testkit = ["getrandom/sys_rng"]

[dependencies]
libc.workspace = true
wicket-core.workspace = true
wicket-store.workspace = true
wicket-placement.workspace = true
wicket-sandbox.workspace = true
wicket-proxy.workspace = true
wicket-agent.workspace = true
wicket-identity.workspace = true
wicket-chan.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
reqwest.workspace = true
url.workspace = true
getrandom.workspace = true
futures-util.workspace = true
sha2.workspace = true
hex.workspace = true
time.workspace = true

[dev-dependencies]
wicket-chan = { workspace = true, features = ["testkit"] }
# audit_export's tests: an edited ledger, and a sink's HTTP server.
rusqlite.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
libc.workspace = true
getrandom = { workspace = true, features = ["sys_rng"] }
