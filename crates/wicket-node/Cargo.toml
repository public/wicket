[package]
name = "wicket-node"
description = "A node (#219): wicket node serve, which runs boxes on a machine and talks the control channel, and its MCP gateway. Split from wicket-cli so the node builds and tests without the control host's code."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wicket-core.workspace = true
wicket-store.workspace = true
wicket-proxy.workspace = true
wicket-chan.workspace = true
wicket-home.workspace = true
wicket-sandbox.workspace = true
wicket-agent.workspace = true
wicket-identity.workspace = true
wicket-feed.workspace = true
wicket-authz.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
hex.workspace = true
sha2.workspace = true
base64.workspace = true
time.workspace = true
libc = "0.2"
rcgen.workspace = true
rustls.workspace = true
x509-parser = { version = "0.18", features = ["verify"] }
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
http.workspace = true
bytes.workspace = true
futures-util.workspace = true

[dev-dependencies]
wicket-chan = { workspace = true, features = ["testkit"] }
wicket-home = { workspace = true, features = ["testkit"] }
getrandom = { workspace = true, features = ["sys_rng"] }
ed25519-dalek = "3"
tar = "0.4"
