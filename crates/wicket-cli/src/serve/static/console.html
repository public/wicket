<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6fde">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="wicket">
<title>wicket</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<!-- No inline script or style: the CSP allows only these files (named by their content hash). -->
<link rel="stylesheet" href="{{css}}" integrity="{{css_sri}}">
<script src="{{js}}" integrity="{{js_sri}}" defer></script>
</head>
<body>
<header><h1>wicket</h1><span id="tenant"></span></header>
<div class="blocked" id="stale" hidden></div>
<main>
  <div id="auth" class="card" hidden></div>
  <div id="console" hidden>
  <h2>Waiting for you</h2>
  <div id="pending"></div>
  <a class="meta" id="standing-pointer" href="#standing"></a>
  <h2>Runs</h2>
  <div class="card" id="runs"></div>
  <!-- A run's authority, or an explained decision (#173): read-only, opened from a row. -->
  <div class="card" id="detail" hidden>
    <div class="buttons"><span id="detail-title" class="mono"></span><button type="button" id="detail-close">Close</button></div>
    <div id="detail-body"></div>
  </div>
  <form class="card" id="runform" hidden>
    <div id="runform-title"></div>
    <textarea id="runform-text"></textarea>
    <div class="buttons"><button type="submit" id="runform-go"></button><button type="button" id="runform-cancel">Cancel</button></div>
  </form>
  <h2>Nodes</h2>
  <div class="card" id="health"></div>
  <div class="card" id="placed"></div>
  <!-- Standing capacity grants (#256): issuing and renewing one is passkey-signed; revoking isn't. -->
  <h2>Capacity</h2>
  <div class="card"><div id="capacity"></div><div id="capacity-form"></div></div>
  <!-- Standing reach (#572): an agent's ask, decided once with the ledger's evidence (passkey-signed),
       and the approved rules, renewed (signed) or revoked (session only). -->
  <h2>Standing reach</h2>
  <div class="card" id="standing"><div id="standing-asks"></div><div id="standing-rules"></div></div>
  <h2>Manifests</h2>
  <div class="card" id="manifests"></div>
  <!-- A manifest, viewed and edited (#172): every save is passkey-signed. -->
  <div class="card" id="mfedit" hidden>
    <div class="buttons"><span id="mfedit-title" class="mono"></span><button type="button" id="mfedit-close">Close</button></div>
    <div id="mfedit-body"></div>
  </div>
  <h2>Secrets</h2>
  <div class="card" id="secrets"></div>
  <!-- Store, rebind or delete a secret: every change is passkey-signed. Outside the list, so the refresh
       doesn't wipe what is being typed; the value field is cleared as soon as it is submitted. -->
  <form class="card" id="secret-edit" autocomplete="off" hidden>
    <div id="secret-edit-title"></div>
    <div id="secret-edit-body"></div>
    <div class="buttons"><button type="submit" id="secret-edit-go"></button><button type="button" id="secret-edit-cancel">Cancel</button></div>
  </form>
  <h2>Start a run</h2>
  <div class="card" id="start"></div>
  <h2>Recent decisions</h2>
  <div class="card" id="decided"></div>
  <h2>Activity</h2>
  <div class="card log" id="audit"></div>
  <h2>Policy</h2>
  <div class="card" id="policy"></div>
  <h2>Notifications</h2>
  <div class="card" id="push"></div>
  <h2>Operator</h2>
  <div class="card" id="operator"></div>
  </div>
</main>
<!-- What the passkey is about to sign (#124): fixed at the top, and it blocks the page below. -->
<div id="confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-title" hidden>
  <div class="card">
    <div id="confirm-title">Your passkey will sign exactly this:</div>
    <div id="confirm-what" class="what"></div>
    <div id="confirm-blast" class="blast" hidden></div>
    <div id="confirm-update" class="blast" hidden></div>
    <div id="confirm-state" class="meta"></div>
    <div class="buttons"><button type="button" id="confirm-go"></button><button type="button" id="confirm-cancel">Cancel</button></div>
  </div>
</div>
<div id="msg" hidden></div>
</body>
</html>
