[package]
name = "wicket-cli"
description = "The wicket command: run a task in a box, decide its requests, read the audit log."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "wicket"
path = "src/main.rs"

[dependencies]
wicket-core.workspace = true
wicket-store.workspace = true
wicket-proxy.workspace = true
wicket-chan.workspace = true
wicket-home.workspace = true
wicket-node.workspace = true
wicket-control.workspace = true
wicket-sandbox.workspace = true
wicket-agent.workspace = true
wicket-auth.workspace = true
wicket-identity.workspace = true
wicket-placement.workspace = true
wicket-feed.workspace = true
wicket-policy.workspace = true
wicket-authz.workspace = true
serde.workspace = true
thiserror.workspace = true
hex.workspace = true
libc = "0.2"
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
serde_json.workspace = true
humantime.workspace = true
# The node's in-memory secret cache (#152): values zeroized when dropped.
zeroize = "1"
rustls.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true
reqwest.workspace = true
# ACME (Let's Encrypt) client for the console's certificates (serve/acme.rs). ring, not aws-lc-rs (ring is
# already in the tree and needs no C toolchain). Its hyper-rustls client is off: wicket supplies the HTTP
# client (reqwest, already a dependency), which is also the seam the tests' mock ACME server plugs into.
# (Its ring feature pulls rcgen 0.14 for CSRs; wicket's own certificates stay on the workspace rcgen.)
instant-acme = { version = "0.8", default-features = false, features = ["ring"] }
x509-parser = { version = "0.18", features = ["verify"] }
tracing.workspace = true
tracing-subscriber.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
http.workspace = true
bytes.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
url.workspace = true
tar = "0.4"
rpassword = "7"
sha2.workspace = true
base64.workspace = true
getrandom.workspace = true
time.workspace = true
# Release signatures (#162), as the identity issuer's.
ed25519-dalek = "3"
# Console Web Push (serve/push.rs): ECDH and ES256 on P-256 (as wicket-auth's passkeys), and ring
# (already in the tree through rustls) for HKDF-SHA-256 and AES-128-GCM.
p256 = { version = "0.14", features = ["ecdsa", "getrandom"] }
ring = "0.17"

[dev-dependencies]
wicket-chan = { workspace = true, features = ["testkit"] }
wicket-home = { workspace = true, features = ["testkit"] }
rusqlite.workspace = true
ciborium = "0.2"
wicket-placement = { workspace = true, features = ["mock"] }
p256 = { version = "0.14", features = ["ecdsa", "getrandom"] }
getrandom = { workspace = true, features = ["sys_rng"] }
