[package]
name = "wicket-cli"
description = "The wicket command: run a task in a sandbox, approve escalations, read the audit log."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "wicket"
path = "src/main.rs"

[dependencies]
wicket-core.workspace = true
wicket-store.workspace = true
wicket-proxy.workspace = true
wicket-sandbox.workspace = true
wicket-agent.workspace = true
wicket-auth.workspace = true
wicket-identity.workspace = true
wicket-placement.workspace = true
wicket-feed.workspace = true
wicket-authz.workspace = true
serde.workspace = true
thiserror.workspace = true
hex.workspace = true
serde_yaml.workspace = true
libc = "0.2"
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
serde_json.workspace = true
humantime.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true
reqwest.workspace = true
# ACME (Let's Encrypt) client for the console's certificates (serve/acme.rs). ring, not aws-lc-rs (ring is
# already in the tree and needs no C toolchain). Its hyper-rustls client is off: wicket supplies the HTTP
# client (reqwest, already a dependency), which is also the seam the tests' mock ACME server plugs into.
# (Its ring feature pulls rcgen 0.14 for CSRs; wicket's own certificates stay on the workspace rcgen.)
instant-acme = { version = "0.8", default-features = false, features = ["ring"] }
x509-parser = "0.16"
tracing.workspace = true
tracing-subscriber.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
http.workspace = true
bytes.workspace = true
futures-util.workspace = true
rpassword = "7"
sha2.workspace = true
base64.workspace = true
getrandom.workspace = true
time.workspace = true

[dev-dependencies]
rusqlite.workspace = true
ciborium = "0.2"
wicket-placement = { workspace = true, features = ["mock"] }
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
