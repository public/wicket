[package]
name = "wicket-chan"
description = "The control/node channel's protocol (#219): its frames and messages, and the modules they carry (node health, a node's secrets, OCI images and registries). Split from wicket-cli so it builds, tests and fuzzes on its own."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The image and registry test kits, for the tests of the crates that use this one (wicket-cli's).
testkit = []

[dependencies]
wicket-core.workspace = true
wicket-store.workspace = true
wicket-proxy.workspace = true
wicket-agent.workspace = true
wicket-identity.workspace = true
wicket-feed.workspace = true
wicket-authz.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures-util.workspace = true
hex.workspace = true
sha2.workspace = true
base64.workspace = true
libc = "0.2"
tar = "0.4"
zeroize = "1"
# Image signatures (#191): both already built for the token format (biscuit-auth), with these features.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pem"] }
ed25519-dalek = { version = "3", default-features = false, features = ["pem"] }

