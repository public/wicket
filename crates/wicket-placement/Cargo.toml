[package]
name = "wicket-placement"
description = "Placement: where boxes run. A provider-neutral interface (capacity, leases, a money envelope) with static-host and Vultr backends."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
ulid.workspace = true
time = { workspace = true, features = ["parsing"] }
# The `mock` feature: a local Vultr API mock for tests (here and in dependent crates).
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }

[features]
mock = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:bytes"]

[dev-dependencies]
wicket-placement = { path = ".", features = ["mock"] }
http.workspace = true
# Paused clocks for the readiness probe's waits (minutes, simulated).
tokio = { workspace = true, features = ["test-util"] }
