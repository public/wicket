[package]
name = "wicket-core"
description = "wicket core types: tenants, zones, reach rules, ops, risk, and the pure decision function. No I/O."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
thiserror.workspace = true
globset.workspace = true
sha2.workspace = true
hex.workspace = true
ulid.workspace = true
getrandom.workspace = true
humantime.workspace = true
url.workspace = true

# The budget counter's atomics under loom (#325, tests/loom_budget.rs): RUSTFLAGS="--cfg loom".
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }

[[bench]]
name = "evaluate"
harness = false

[lints.rust]
# `cargo kani` sets `cfg(kani)` for the proof harnesses, and ci/kani.sh `cfg(loom)` for the loom
# test (#325).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(loom)"] }
