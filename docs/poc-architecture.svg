<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1110" viewBox="0 0 1500 1110" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
    <style>
      .t{font-weight:700;font-size:15px}
      .h{font-weight:700}
      .m{font-family:"JetBrains Mono",Menlo,Consolas,monospace;font-size:12px}
      .s{font-size:12px;fill:#444}
      .proc{fill:#fff;stroke:#2e7d32;stroke-width:2}
      .sub{fill:#eef6ee;stroke:#2e7d32;stroke-width:1}
      .file{fill:#fff8e1;stroke:#a07800;stroke-width:1.2}
      .box{fill:#fdecea;stroke:#b3261e;stroke-width:2.5;stroke-dasharray:8 4}
      .bproc{fill:#fff;stroke:#b3261e;stroke-width:1.2}
      .ext{fill:#f3f3f3;stroke:#777;stroke-width:1.2}
      .node{fill:#f5f7fb;stroke:#5b6b8c;stroke-width:2}
      .flow{stroke:#444;stroke-width:1.6;fill:none}
      .rflow{stroke:#b3261e;stroke-width:1.8;fill:none}
      .bflow{stroke:#1f5fbf;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    </style>
  </defs>

  <text x="20" y="32" font-size="22" font-weight="700">wicket PoC: processes, boundaries and what runs where</text>
  <text x="20" y="54" class="s">Green: trusted (holds secrets). Red dashed: untrusted box (no secrets, no network). Grey-blue: remote node (no secrets). Yellow: files on disk.</text>

  <!-- ================= CONTROL HOST ================= -->
  <rect x="20" y="70" width="930" height="1020" rx="14" fill="#f7fbf7" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="38" y="96" class="t">Control host (Linux, the operator's user account)</text>
  <text x="38" y="114" class="s">Holds every secret. One `wicket run` process per run; the console is separate.</text>

  <!-- wicket run process -->
  <rect x="40" y="128" width="500" height="372" rx="10" class="proc"/>
  <text x="56" y="152" class="h">Process: <tspan class="m">wicket run task.yaml</tspan>  (one per run, tokio)</text>
  <text x="56" y="170" class="s">Three enforcement points as async tasks, each on its own unix socket in runs/&lt;id&gt;/sock/</text>

  <rect x="56" y="182" width="468" height="78" rx="6" class="sub"/>
  <text x="68" y="202" class="h">Egress proxy  <tspan class="m">egress.sock</tspan></text>
  <text x="68" y="220" class="s">HTTP CONNECT + TLS interception with a per-run CA (key in memory only).</text>
  <text x="68" y="236" class="s">Each request → Op → reach rules / risk class → allow, forbid, or pending.</text>
  <text x="68" y="252" class="s">Injects upstream credentials into the declared header; strips auth/cookies.</text>

  <rect x="56" y="268" width="468" height="62" rx="6" class="sub"/>
  <text x="68" y="288" class="h">LLM proxy  <tspan class="m">llm.sock</tspan></text>
  <text x="68" y="306" class="s">Swaps the placeholder for the real Claude subscription bearer; request and</text>
  <text x="68" y="322" class="s">output-token budgets; strips server-side tools (web search).</text>

  <rect x="56" y="338" width="468" height="62" rx="6" class="sub"/>
  <text x="68" y="358" class="h">MCP gateway  <tspan class="m">gateway.sock</tspan></text>
  <text x="68" y="376" class="s">Tools <tspan class="m">await_grant</tspan>, <tspan class="m">pending_requests</tspan>: the agent waits for a human</text>
  <text x="68" y="392" class="s">decision (polls the ledger every 2 s) instead of retrying blindly.</text>

  <rect x="56" y="408" width="228" height="78" rx="6" class="sub"/>
  <text x="68" y="428" class="h">Run supervisor</text>
  <text x="68" y="446" class="s">builds the run dir, launches the</text>
  <text x="68" y="462" class="s">box, streams Claude's events,</text>
  <text x="68" y="478" class="s">withdraws pending at run end</text>

  <rect x="296" y="408" width="228" height="78" rx="6" class="sub"/>
  <text x="308" y="428" class="h">docker CLI</text>
  <text x="308" y="446" class="s">local: <tspan class="m">docker run</tspan></text>
  <text x="308" y="462" class="s">remote: <tspan class="m">ssh node docker run</tspan></text>
  <text x="308" y="478" class="s">(args shell-quoted)</text>

  <!-- console process -->
  <rect x="560" y="128" width="370" height="220" rx="10" class="proc"/>
  <text x="576" y="152" class="h">Process: <tspan class="m">wicket serve</tspan>  (console)</text>
  <text x="576" y="172" class="m">127.0.0.1:8787</text><text x="680" y="172" class="s">(loopback unless --allow-remote)</text>
  <text x="576" y="194" class="s">• passkey enrolment (one-time link) and sign-in</text>
  <text x="576" y="212" class="s">• lists pending requests, runs, decisions, activity</text>
  <text x="576" y="230" class="s">• every approve/deny is a WebAuthn assertion over</text>
  <text x="576" y="246" class="s">   sha256("wicket-decision-v1"‖nonce‖decision)</text>
  <text x="576" y="264" class="s">• verifies UV, rpId, origin, counter; single-use</text>
  <text x="576" y="280" class="s">   2-minute challenges; writes grant + signature</text>
  <text x="576" y="298" class="s">• no secrets except operator public keys</text>
  <text x="576" y="326" class="s">Talks to <tspan font-style="italic">wicket run</tspan> only through the ledger.</text>

  <rect x="560" y="360" width="370" height="140" rx="10" class="proc"/>
  <text x="576" y="384" class="h">Process: <tspan class="m">wicket pending|approve|deny|audit</tspan></text>
  <text x="576" y="404" class="s">Short-lived CLI on the host.</text>
  <text x="576" y="422" class="s">• <tspan class="m">approve</tspan> = break-glass (no passkey; audited as such)</text>
  <text x="576" y="440" class="s">• <tspan class="m">audit --verify</tspan> checks the hash chain and re-verifies</text>
  <text x="576" y="456" class="s">   every passkey-signed decision offline</text>
  <text x="576" y="474" class="s">• <tspan class="m">secret set|link</tspan> reads values from the terminal only</text>

  <!-- files -->
  <rect x="40" y="518" width="290" height="112" rx="8" class="file"/>
  <text x="52" y="538" class="h">Ledger  <tspan class="m">~/.local/share/wicket/ledger.db</tspan></text>
  <text x="52" y="556" class="s">SQLite: runs, requests, grants (single-use,</text>
  <text x="52" y="572" class="s">expiring, consumed atomically), operator</text>
  <text x="52" y="588" class="s">passkeys (revocable, never deleted), and</text>
  <text x="52" y="604" class="s">the hash-chained audit log.</text>
  <text x="52" y="620" class="s">The only channel between run and console.</text>

  <rect x="342" y="518" width="290" height="112" rx="8" class="file"/>
  <text x="354" y="538" class="h">Vault  <tspan class="m">~/.config/wicket/secrets/</tspan></text>
  <text x="354" y="556" class="s">One 0600 file per secret, or a .ref that</text>
  <text x="354" y="572" class="s">points into the host's Claude Code login</text>
  <text x="354" y="588" class="s">(access token only, read per request;</text>
  <text x="354" y="604" class="s">refresh token never touched).</text>
  <text x="354" y="620" class="s">Read only by the proxies.</text>

  <rect x="644" y="518" width="286" height="112" rx="8" class="file"/>
  <text x="656" y="538" class="h">Run dir  <tspan class="m">runs/&lt;id&gt;/</tspan>  (0700)</text>
  <text x="656" y="558" class="m">sock/</text><text x="716" y="558" class="s">3 unix sockets</text>
  <text x="656" y="576" class="m">ca/ca.pem</text><text x="736" y="576" class="s">public cert only</text>
  <text x="656" y="594" class="m">state/</text><text x="716" y="594" class="s">box HOME, Claude config</text>
  <text x="656" y="612" class="m">workspace/</text><text x="740" y="612" class="s">copy of --workdir</text>

  <!-- docker + gvisor -->
  <rect x="40" y="648" width="890" height="428" rx="10" fill="#fff" stroke="#666" stroke-width="1.5"/>
  <text x="56" y="672" class="h">dockerd + containerd  →  runtime <tspan class="m">runsc</tspan> (gVisor)</text>
  <text x="56" y="690" class="s">Host processes. They launch the box; nothing in the box can talk to them.</text>

  <rect x="60" y="702" width="850" height="358" rx="10" class="box"/>
  <text x="76" y="726" class="t" fill="#b3261e">The box: a gVisor sandbox (untrusted)</text>
  <text x="76" y="745" class="s">--network none · --cap-drop ALL · no-new-privileges · read-only root · tmpfs /tmp · host uid · memory/cpu/pids limits</text>
  <text x="76" y="762" class="s">Syscalls hit gVisor's user-space kernel (Sentry), not the host kernel. The only interface is loopback. No secrets inside.</text>

  <rect x="76" y="776" width="270" height="270" rx="8" fill="#fff" stroke="#b3261e" stroke-width="1"/>
  <text x="88" y="796" class="h">Bind mounts</text>
  <text x="88" y="818" class="m">/wicket/sock</text><text x="200" y="818" class="s">← sock/ (rw)</text>
  <text x="88" y="838" class="m">/wicket/ca</text><text x="200" y="838" class="s">← ca/ (ro)</text>
  <text x="88" y="858" class="m">/wicket/state</text><text x="200" y="858" class="s">← state/ (rw)</text>
  <text x="88" y="878" class="m">/workspace</text><text x="200" y="878" class="s">← workspace/ (rw)</text>
  <text x="88" y="906" class="h">Env the agent sees</text>
  <text x="88" y="926" class="m">ANTHROPIC_BASE_URL=</text>
  <text x="98" y="942" class="m">http://127.0.0.1:8080</text>
  <text x="88" y="960" class="m">CLAUDE_CODE_OAUTH_TOKEN=</text>
  <text x="98" y="976" class="m">sk-ant-oat01-wicket-placeholder-…</text>
  <text x="88" y="994" class="m">HTTPS_PROXY=127.0.0.1:3128</text>
  <text x="88" y="1012" class="s">MCP config: wicket at 127.0.0.1:8081</text>
  <text x="88" y="1030" class="s">Trusts the run CA's public cert.</text>

  <!-- in-box processes -->
  <rect x="366" y="776" width="528" height="50" rx="6" class="bproc"/>
  <text x="378" y="796" class="h">PID 1: tini (--init)  →  <tspan class="m">wicket-entry</tspan></text>
  <text x="378" y="814" class="s">starts the forwarders, builds the CA bundle, then execs the agent</text>

  <rect x="366" y="838" width="528" height="98" rx="6" class="bproc"/>
  <text x="378" y="858" class="h">3 × socat: loopback TCP → bind-mounted unix socket</text>
  <text x="378" y="878" class="m">127.0.0.1:3128 → /wicket/sock/egress.sock</text>
  <text x="378" y="896" class="m">127.0.0.1:8080 → /wicket/sock/llm.sock</text>
  <text x="378" y="914" class="m">127.0.0.1:8081 → /wicket/sock/gateway.sock</text>
  <text x="378" y="930" class="s">Convenience only: enforcement is outside, on the other end.</text>

  <rect x="366" y="948" width="528" height="98" rx="6" class="bproc"/>
  <text x="378" y="968" class="h"><tspan class="m">claude -p --output-format stream-json</tspan> (Node)</text>
  <text x="378" y="986" class="s">--permission-mode bypassPermissions (safe because the box has no route out)</text>
  <text x="378" y="1002" class="s">--disallowedTools WebSearch · --strict-mcp-config · notice appended to prompt</text>
  <text x="378" y="1020" class="s">stdout = stream-json events → run supervisor → terminal + audit</text>
  <text x="378" y="1036" class="s">Programs: the same box runs the digest-pinned command instead; no model token.</text>

  <!-- ================= RIGHT COLUMN ================= -->
  <rect x="980" y="70" width="500" height="250" rx="14" class="ext"/>
  <text x="998" y="96" class="t">Internet</text>
  <rect x="998" y="112" width="464" height="74" rx="8" fill="#fff" stroke="#777"/>
  <text x="1010" y="132" class="h m">api.anthropic.com</text>
  <text x="1010" y="150" class="s">Only the LLM proxy calls it, with the subscription</text>
  <text x="1010" y="166" class="s">bearer it injected. Client auth headers never forwarded.</text>
  <rect x="998" y="196" width="464" height="108" rx="8" fill="#fff" stroke="#777"/>
  <text x="1010" y="216" class="h">Hosts in the zone's reach (e.g. github.com)</text>
  <text x="1010" y="234" class="s">Reached only via the egress proxy, re-encrypted with</text>
  <text x="1010" y="250" class="s">real TLS. Authority pinned to the CONNECT target.</text>
  <text x="1010" y="266" class="s">Non-public IPs and cloud metadata always forbidden.</text>
  <text x="1010" y="284" class="s">Out-of-reach or risky (e.g. git push) → pending request.</text>

  <rect x="980" y="340" width="500" height="160" rx="14" class="ext"/>
  <text x="998" y="366" class="t">Operator (phone or laptop browser)</text>
  <text x="998" y="388" class="s">Platform authenticator holds the passkey (user verification required).</text>
  <text x="998" y="406" class="s">Reaches the console over an SSH tunnel or a tailnet; the PoC</text>
  <text x="998" y="422" class="s">refuses a public listen address without --allow-remote.</text>
  <text x="998" y="446" class="s">Approve once (10 min), allow for 1 hour, or deny. Each tap</text>
  <text x="998" y="462" class="s">signs that exact decision; the signature lands in the ledger</text>
  <text x="998" y="478" class="s">and can be verified later without the console.</text>

  <rect x="980" y="520" width="500" height="430" rx="14" class="node"/>
  <text x="998" y="546" class="t">Optional: remote sandbox node (Vultr)</text>
  <text x="998" y="566" class="s"><tspan class="m">wicket run --node wicket@IP --ssh-key K</tspan></text>
  <rect x="998" y="580" width="464" height="64" rx="8" fill="#fff" stroke="#5b6b8c"/>
  <text x="1010" y="600" class="h">sshd  ·  user <tspan class="m">wicket</tspan> (docker group, not root)</text>
  <text x="1010" y="618" class="s">Nothing else listens on the public IP.</text>
  <text x="1010" y="634" class="s">Set up once by deploy/vultr/node-setup.sh.</text>
  <rect x="998" y="654" width="464" height="100" rx="8" fill="#fff" stroke="#5b6b8c"/>
  <text x="1010" y="674" class="h">ssh -R, one per socket (unix → unix)</text>
  <text x="1010" y="692" class="s">The node's runs/&lt;id&gt;/sock/*.sock are forwarded back</text>
  <text x="1010" y="708" class="s">to the control host's sockets for the life of the run.</text>
  <text x="1010" y="724" class="s">So the proxies, CA key, vault and ledger never leave the</text>
  <text x="1010" y="740" class="s">control host.</text>
  <rect x="998" y="764" width="464" height="88" rx="8" class="box"/>
  <text x="1010" y="786" class="h" fill="#b3261e">dockerd + runsc: the same box</text>
  <text x="1010" y="804" class="s">Identical flags, image and in-box processes as on the</text>
  <text x="1010" y="820" class="s">left. Docker is driven over ssh from the control host.</text>
  <text x="1010" y="838" class="s">The image is built on the node (host network for the build only).</text>
  <text x="998" y="876" class="h">What the node holds</text>
  <text x="998" y="896" class="s">The CA's public cert, a copy of the workspace, the box's state.</text>
  <text x="998" y="914" class="s">No tokens, keys or ledger. Checked after the real run: zero matches</text>
  <text x="998" y="930" class="s">for the token on the node, then the node was destroyed.</text>

  <!-- legend of flows -->
  <rect x="980" y="966" width="500" height="124" rx="10" fill="#fff" stroke="#bbb"/>
  <text x="998" y="988" class="h">Flows</text>
  <line x1="998" y1="1008" x2="1048" y2="1008" class="rflow" marker-end="url(#r)"/><text x="1058" y="1012" class="s">agent traffic leaving the box (only via unix sockets)</text>
  <line x1="998" y1="1032" x2="1048" y2="1032" class="flow" marker-end="url(#a)"/><text x="1058" y="1036" class="s">trusted calls (proxies → internet, processes → files)</text>
  <line x1="998" y1="1056" x2="1048" y2="1056" class="bflow" marker-end="url(#b)"/><text x="1058" y="1060" class="s">control: launch the box, human decisions</text>
  <text x="998" y="1080" class="s">Every crossing is audited in the ledger's hash chain.</text>

  <!-- ================= ARROWS (routed through gaps) ================= -->
  <!-- box → bind-mounted sockets → proxies -->
  <path d="M 894 880 H 940 V 512 H 556 V 232 H 528" class="rflow" marker-end="url(#r)"/>
  <!-- proxies → internet -->
  <path d="M 524 215 H 546 V 62 H 960 V 245 H 996" class="flow" marker-end="url(#a)"/>
  <path d="M 524 300 H 551 V 66 H 966 V 150 H 996" class="flow" marker-end="url(#a)"/>
  <!-- proxies → ledger, vault -->
  <path d="M 140 500 V 516" class="flow" marker-end="url(#a)"/>
  <path d="M 440 500 V 516" class="flow" marker-end="url(#a)"/>
  <!-- console + CLI → ledger -->
  <path d="M 575 500 L 322 516" class="flow" marker-end="url(#a)"/>
  <!-- docker CLI → local dockerd -->
  <path d="M 336 486 V 646" class="bflow" marker-end="url(#b)"/>
  <!-- docker CLI → remote node over ssh -->
  <path d="M 500 486 V 506 H 638 V 640 H 972 V 612 H 996" class="bflow" marker-end="url(#b)"/>
  <!-- operator → console -->
  <path d="M 980 420 C 955 420 950 250 932 240" class="bflow" marker-end="url(#b)"/>
</svg>
