\* model: RunLifecycle
\* Before #474: the reconciler ended a lost run but not its agent, which stayed active with nobody behind it. Must fail ActiveHasRun.
\* Small, explicit bounds; ci/tla.sh runs this file. See README.md.
SPECIFICATION Spec
CONSTANTS
    Runs = {"r1", "r2"}
    Msgs = {"m1"}
    ClaimTtl = 1
    AuthTtl = 3
    MaxTime = 5
    MaxCrashes = 1
    MaxDrops = 0
    FinishInLedger = TRUE
    AckAfterHand = TRUE
    RequeueOnReconnect = TRUE
    WakeAfterAuthority = TRUE
    EndAgentOnLost = FALSE
INVARIANTS TypeOK OneHarness NoMessageLost NoMessageStuck NoMessageTwice FinishKnown ActiveHasRun
