\* model: RunLifecycle
\* Before #445: a message was marked delivered when its supervisor took it, and lost if the control host stopped before the box had it. Must fail NoMessageLost.
\* Small, explicit bounds; ci/tla.sh runs this file. See README.md.
SPECIFICATION Spec
CONSTANTS
    Runs = {"r1", "r2"}
    Msgs = {"m1"}
    ClaimTtl = 1
    AuthTtl = 3
    MaxTime = 5
    MaxCrashes = 1
    MaxDrops = 0
    FinishInLedger = TRUE
    AckAfterHand = FALSE
    RequeueOnReconnect = TRUE
    WakeAfterAuthority = TRUE
    EndAgentOnLost = TRUE
INVARIANTS TypeOK OneHarness NoMessageLost NoMessageStuck NoMessageTwice FinishKnown ActiveHasRun
