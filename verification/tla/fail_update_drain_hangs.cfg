\* model: Update
\* #487: the SIGHUP drain took the registry lock it held, never returned, and the daemon refused every command until it was restarted. Must fail DaemonTakesCommands.
\* Small, explicit bounds; ci/tla.sh runs this file. See README.md.
SPECIFICATION Spec
CONSTANTS
    Runs = {"r1", "r2"}
    Prompts = {"p1", "p2"}
    MaxTime = 4
    HandoverMax = 1
    DrainMax = 1
    ExpandSafe = TRUE
    HandOverOnStart = TRUE
    DrainReturns = FALSE
INVARIANTS TypeOK DaemonTakesCommands
