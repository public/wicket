\* model: ApprovalEffect
\* #369 without KeepIdentity: the hop relays the child as the parent. Must fail (IdentityKeptAcrossHops).
SPECIFICATION Spec
CONSTANTS
    Ids = {1, 2}
    Parent = "parent"
    Child = "child"
    Effects = {"e1"}
    Args = {"a1", "a2"}
    Lifetime = 1
    MaxTime = 2
    Hold = TRUE
    ConsumeOnce = TRUE
    CheckAtRun = TRUE
    KeepIdentity = FALSE
    BindArgs = TRUE
INVARIANTS TypeOK HoldUntilDecided ExactlyOnceOnReplay NoActionAfterExpiry IdentityKeptAcrossHops ArgumentsBound
