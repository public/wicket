\* model: UpdateTrace
\* The same misordered mapping: not a behaviour of fail_update_drain_hangs either, so mapped as written it would raise neither a match nor #487. Must pass.
\* Small, explicit bounds; ci/tla.sh runs this file. See README.md, "Update: trails of real updates".
SPECIFICATION TraceSpec
CONSTANTS
    Runs = {"r1", "r2"}
    LocalRuns = {"r1"}
    Prompts = {"p1", "p2"}
    MaxTime = 4
    HandoverMax = 1
    DrainMax = 1
    ExpandSafe = TRUE
    HandOverOnStart = TRUE
    DrainReturns = FALSE
    ServeFirstOnStart = TRUE
    ServeFirstOnUpdate = TRUE
    ViaInstall = FALSE
    DaemonAudited = TRUE
    Trail <- TrailMisordered
INVARIANTS TrailUnmatched
