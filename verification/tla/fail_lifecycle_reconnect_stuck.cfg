\* model: RunLifecycle
\* Before #453: a message in flight when the link to the box's node dropped stayed in flight until a later supervisor. Must fail NoMessageStuck.
\* Small, explicit bounds; ci/tla.sh runs this file. See README.md.
SPECIFICATION Spec
CONSTANTS
    Runs = {"r1", "r2"}
    Msgs = {"m1"}
    ClaimTtl = 1
    AuthTtl = 3
    MaxTime = 5
    MaxCrashes = 1
    MaxDrops = 1
    FinishInLedger = TRUE
    AckAfterHand = TRUE
    RequeueOnReconnect = FALSE
    WakeAfterAuthority = TRUE
INVARIANTS TypeOK OneHarness NoMessageLost NoMessageStuck NoMessageTwice FinishKnown
