\* model: Update
\* #475 as it happened: schema 17 wasn't expand-safe for older readers, and an install's restart left supervisors on the old build (#468), which dropped the new build's prompts. Must fail NoPromptLost.
\* Small, explicit bounds; ci/tla.sh runs this file. See README.md.
SPECIFICATION Spec
CONSTANTS
    Runs = {"r1", "r2"}
    Prompts = {"p1", "p2"}
    MaxTime = 4
    HandoverMax = 1
    DrainMax = 1
    ExpandSafe = FALSE
    HandOverOnStart = FALSE
    DrainReturns = TRUE
INVARIANTS TypeOK NoPromptLost
