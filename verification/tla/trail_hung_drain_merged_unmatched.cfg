\* model: UpdateTrace
\* A self update whose drain never returns (#487), its trail constructed as the records daemon.sighup and daemon.started would read it: two drain bounds pass after the SIGHUP with no daemon.started. Not a behaviour of the design as merged: must pass.
\* Small, explicit bounds; ci/tla.sh runs this file. See README.md, "Update: trails of real updates".
SPECIFICATION TraceSpec
CONSTANTS
    Runs = {"r1", "r2"}
    LocalRuns = {"r1"}
    Prompts = {"p1", "p2"}
    MaxTime = 4
    HandoverMax = 1
    DrainMax = 1
    ExpandSafe = TRUE
    HandOverOnStart = TRUE
    DrainReturns = TRUE
    ServeFirstOnStart = TRUE
    ServeFirstOnUpdate = TRUE
    ViaInstall = FALSE
    DaemonAudited = TRUE
    Trail <- TrailHungDrain
INVARIANTS TrailUnmatched
