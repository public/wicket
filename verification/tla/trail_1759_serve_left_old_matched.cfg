\* model: UpdateTrace
\* The 17:58 install that lost the local box (#529), as audited: a behaviour of fail_update_local_serve_left_old's switches (wicketd's start does not move the local serve). Must be refused with TrailUnmatched: TLC finds the behaviour.
\* Small, explicit bounds; ci/tla.sh runs this file. See README.md, "Update: trails of real updates".
SPECIFICATION TraceSpec
CONSTANTS
    Runs = {"r1", "r2"}
    LocalRuns = {"r1"}
    Prompts = {"p1", "p2"}
    MaxTime = 4
    HandoverMax = 1
    DrainMax = 1
    ExpandSafe = TRUE
    HandOverOnStart = TRUE
    DrainReturns = TRUE
    ServeFirstOnStart = FALSE
    ServeFirstOnUpdate = TRUE
    ViaInstall = TRUE
    DaemonAudited = FALSE
    Trail <- Trail1759
INVARIANTS TrailUnmatched
