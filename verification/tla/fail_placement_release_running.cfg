\* model: Placement
\* #294, #324: a node released at its lease end with a run's work on it. Must fail NoReleaseWithWork.
\* Small, explicit bounds; ci/tla.sh runs this file. See README.md.
SPECIFICATION Spec
CONSTANTS
    Nodes = {"n1"}
    Runs = {"r1", "r2"}
    Cap = 1
    Lease = 2
    MaxTime = 4
    StartByCheck = TRUE
    Admission = TRUE
    FreeAtContainerEnd = TRUE
    ReleaseHolds = FALSE
INVARIANTS TypeOK NoStartPastLease NoOvercommit NoReleaseWithWork
