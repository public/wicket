\* model: ApprovalEffect
\* #369 without ConsumeOnce: a replayed action runs its one use twice. Must fail (ExactlyOnceOnReplay).
SPECIFICATION Spec
CONSTANTS
    Ids = {1, 2}
    Parent = "parent"
    Child = "child"
    Effects = {"e1"}
    Args = {"a1", "a2"}
    Lifetime = 1
    MaxTime = 2
    Hold = TRUE
    ConsumeOnce = FALSE
    CheckAtRun = TRUE
    KeepIdentity = TRUE
    BindArgs = TRUE
INVARIANTS TypeOK HoldUntilDecided ExactlyOnceOnReplay NoActionAfterExpiry IdentityKeptAcrossHops ArgumentsBound
