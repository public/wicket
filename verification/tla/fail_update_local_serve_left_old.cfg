\* model: Update
\* #529: deploy/install.sh restarted wicketd, which left its child, the local node's serve, on the old build; the new wicketd handed the local run over, and its new-build supervisor, re-attached to the old serve, lost the run's box. Must fail BoxesKept.
\* Small, explicit bounds; ci/tla.sh runs this file. See README.md.
SPECIFICATION Spec
CONSTANTS
    Runs = {"r1", "r2"}
    LocalRuns = {"r1"}
    Prompts = {"p1", "p2"}
    MaxTime = 4
    HandoverMax = 1
    DrainMax = 1
    ExpandSafe = TRUE
    HandOverOnStart = TRUE
    DrainReturns = TRUE
    ServeFirstOnStart = FALSE
    ServeFirstOnUpdate = TRUE
INVARIANTS TypeOK BoxesKept
