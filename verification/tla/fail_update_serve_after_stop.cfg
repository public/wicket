\* model: Update
\* #529, in a self update: its handover stopped the old supervisors before it re-executed the local serve, so a reconciler could re-attach a local run to the old serve in between and lose its box. Must fail BoxesKept.
\* Small, explicit bounds; ci/tla.sh runs this file. See README.md.
SPECIFICATION Spec
CONSTANTS
    Runs = {"r1", "r2"}
    LocalRuns = {"r1"}
    Prompts = {"p1", "p2"}
    MaxTime = 4
    HandoverMax = 1
    DrainMax = 1
    ExpandSafe = TRUE
    HandOverOnStart = TRUE
    DrainReturns = TRUE
    ServeFirstOnStart = TRUE
    ServeFirstOnUpdate = FALSE
INVARIANTS TypeOK BoxesKept
