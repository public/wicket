\* model: RunLifecycle
\* Today: a wake takes over an agent whose claim lapsed during a control-host outage while its box still runs. Must fail OneHarness.
\* Small, explicit bounds; ci/tla.sh runs this file. See README.md.
SPECIFICATION Spec
CONSTANTS
    Runs = {"r1", "r2"}
    Msgs = {"m1"}
    ClaimTtl = 1
    AuthTtl = 3
    MaxTime = 5
    MaxCrashes = 1
    FinishInLedger = TRUE
    AckAfterHand = TRUE
    WakeAfterAuthority = FALSE
INVARIANTS TypeOK OneHarness NoMessageLost NoMessageTwice FinishKnown
