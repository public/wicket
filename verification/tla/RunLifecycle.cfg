\* model: RunLifecycle
\* The pass design: finish in the ledger (the code, #444), messages acknowledged once the box has them, a lapsed agent woken once its box stopped. Must pass.
\* Small, explicit bounds; ci/tla.sh runs this file. See README.md.
SPECIFICATION Spec
CONSTANTS
    Runs = {"r1", "r2"}
    Msgs = {"m1"}
    ClaimTtl = 1
    AuthTtl = 3
    MaxTime = 5
    MaxCrashes = 1
    FinishInLedger = TRUE
    AckAfterHand = TRUE
    WakeAfterAuthority = TRUE
INVARIANTS TypeOK OneHarness NoMessageLost NoMessageTwice FinishKnown
