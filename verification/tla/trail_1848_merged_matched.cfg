\* model: UpdateTrace
\* The 18:48 install, with #531, as audited: a behaviour of the design as merged (Update.cfg's switches). Must be refused with TrailUnmatched: TLC finds the behaviour.
\* Small, explicit bounds; ci/tla.sh runs this file. See README.md, "Update: trails of real updates".
SPECIFICATION TraceSpec
CONSTANTS
    Runs = {"r1", "r2"}
    LocalRuns = {"r1"}
    Prompts = {"p1", "p2"}
    MaxTime = 4
    HandoverMax = 1
    DrainMax = 1
    ExpandSafe = TRUE
    HandOverOnStart = TRUE
    DrainReturns = TRUE
    ServeFirstOnStart = TRUE
    ServeFirstOnUpdate = TRUE
    ViaInstall = TRUE
    DaemonAudited = FALSE
    Trail <- Trail1848
INVARIANTS TrailUnmatched
