\* model: UpdateTrace
\* A self update whose drain returns (daemon.started after the SIGHUP), constructed: a behaviour of the design as merged. Must be refused with TrailUnmatched.
\* Small, explicit bounds; ci/tla.sh runs this file. See README.md, "Update: trails of real updates".
SPECIFICATION TraceSpec
CONSTANTS
    Runs = {"r1", "r2"}
    LocalRuns = {"r1"}
    Prompts = {"p1", "p2"}
    MaxTime = 4
    HandoverMax = 1
    DrainMax = 1
    ExpandSafe = TRUE
    HandOverOnStart = TRUE
    DrainReturns = TRUE
    ServeFirstOnStart = TRUE
    ServeFirstOnUpdate = TRUE
    ViaInstall = FALSE
    DaemonAudited = TRUE
    Trail <- TrailSelfUpdate
INVARIANTS TrailUnmatched
