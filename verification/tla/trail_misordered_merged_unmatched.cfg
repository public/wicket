\* model: UpdateTrace
\* The records of a self update out of order (daemon.started before its daemon.sighup), mapped as written: a restart and a drain with no end. Not a behaviour of the design as merged: must pass (ci/tla-trail.py pairs such records instead).
\* Small, explicit bounds; ci/tla.sh runs this file. See README.md, "Update: trails of real updates".
SPECIFICATION TraceSpec
CONSTANTS
    Runs = {"r1", "r2"}
    LocalRuns = {"r1"}
    Prompts = {"p1", "p2"}
    MaxTime = 4
    HandoverMax = 1
    DrainMax = 1
    ExpandSafe = TRUE
    HandOverOnStart = TRUE
    DrainReturns = TRUE
    ServeFirstOnStart = TRUE
    ServeFirstOnUpdate = TRUE
    ViaInstall = FALSE
    DaemonAudited = TRUE
    Trail <- TrailMisordered
INVARIANTS TrailUnmatched
