\* model: Update
\* The pass design: expand-safe schema steps, wicketd's start hands old-build supervisors over (#477), the SIGHUP drain returns (#489), and the local node's serve moves to the new build before any run is handed over (#529). Must pass.
\* Small, explicit bounds; ci/tla.sh runs this file. See README.md.
SPECIFICATION Spec
CONSTANTS
    Runs = {"r1", "r2"}
    LocalRuns = {"r1"}
    Prompts = {"p1", "p2"}
    MaxTime = 4
    HandoverMax = 1
    DrainMax = 1
    ExpandSafe = TRUE
    HandOverOnStart = TRUE
    DrainReturns = TRUE
    ServeFirstOnStart = TRUE
    ServeFirstOnUpdate = TRUE
INVARIANTS TypeOK NoPromptLost OldBuildBounded DaemonTakesCommands BoxesKept
