\* model: RunLifecycle
\* Before #444: the agent's finish was known only to its supervisor, and a control-host restart lost it. Must fail FinishKnown.
\* Small, explicit bounds; ci/tla.sh runs this file. See README.md.
SPECIFICATION Spec
CONSTANTS
    Runs = {"r1", "r2"}
    Msgs = {"m1"}
    ClaimTtl = 1
    AuthTtl = 3
    MaxTime = 5
    MaxCrashes = 1
    FinishInLedger = FALSE
    AckAfterHand = TRUE
    WakeAfterAuthority = TRUE
INVARIANTS TypeOK OneHarness NoMessageLost NoMessageTwice FinishKnown
