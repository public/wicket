\* model: Update
\* Before #477: an install's restart left every run's supervisor on the old build for as long as the run lived. Must fail OldBuildBounded.
\* Small, explicit bounds; ci/tla.sh runs this file. See README.md.
SPECIFICATION Spec
CONSTANTS
    Runs = {"r1", "r2"}
    Prompts = {"p1", "p2"}
    MaxTime = 4
    HandoverMax = 1
    DrainMax = 1
    ExpandSafe = TRUE
    HandOverOnStart = FALSE
    DrainReturns = TRUE
INVARIANTS TypeOK OldBuildBounded
