\* model: RunLifecycle
\* Every switch as on main. Must fail one of FinishKnown, NoMessageLost, OneHarness.
\* Small, explicit bounds; ci/tla.sh runs this file. See README.md.
SPECIFICATION Spec
CONSTANTS
    Runs = {"r1", "r2"}
    Msgs = {"m1"}
    ClaimTtl = 1
    AuthTtl = 3
    MaxTime = 5
    MaxCrashes = 1
    FinishInLedger = FALSE
    AckAfterHand = FALSE
    WakeAfterAuthority = FALSE
INVARIANTS TypeOK OneHarness NoMessageLost NoMessageTwice FinishKnown
