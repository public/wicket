\* model: Placement
\* Before #395: a placed node started a box past its lease. Must fail NoStartPastLease.
\* Small, explicit bounds; ci/tla.sh runs this file. See README.md.
SPECIFICATION Spec
CONSTANTS
    Nodes = {"n1"}
    Runs = {"r1", "r2"}
    Cap = 1
    Lease = 2
    MaxTime = 4
    StartByCheck = FALSE
    Admission = TRUE
    FreeAtContainerEnd = TRUE
    ReleaseHolds = TRUE
INVARIANTS TypeOK NoStartPastLease NoOvercommit NoReleaseWithWork
