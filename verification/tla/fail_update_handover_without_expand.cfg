\* model: Update
\* The handover alone isn't enough: with a schema step that isn't expand-safe, a prompt sent in the seconds before the old supervisor is stopped is still dropped. The expand rule (and the store's previous_build test) is what closes it. Must fail NoPromptLost.
\* Small, explicit bounds; ci/tla.sh runs this file. See README.md.
SPECIFICATION Spec
CONSTANTS
    Runs = {"r1", "r2"}
    Prompts = {"p1", "p2"}
    MaxTime = 4
    HandoverMax = 1
    DrainMax = 1
    ExpandSafe = FALSE
    HandOverOnStart = TRUE
    DrainReturns = TRUE
INVARIANTS TypeOK NoPromptLost
